{id:34,w:2,topic:"Graphs",name:"Number of Islands",diff:"M",tag:"dfs",
oneliner:"For each unvisited '1': increment count, flood-fill (DFS/BFS) marking all connected '1's visited.",
ds:{name:"DFS + In-place Visited Marking",icon:"🏝️",
why:"Each island is a connected component. DFS from any cell floods the whole component. Marking visited by setting '0' uses O(1) extra space vs a separate visited boolean[][]. O(m×n) total.",
alt:"BFS (queue): iterative, avoids recursion stack overflow for huge grids. Union-Find: O(m×n α(m×n)) — useful for dynamic connectivity.",
cx:["Time: O(m×n)","Space: O(m×n) recursion stack worst case"]},
intuition:"Walk every cell. When you hit an unvisited '1', you've found a new island — increment count and flood-fill it via DFS, converting all its '1's to '0's to mark them visited. Next unvisited '1' you find is a new island.",
steps:["For each cell (r,c): if grid[r][c]=='1': count++; dfs(r,c)","DFS: bounds check, grid[r][c]!='1' → return; set grid[r][c]='0'","Recurse on 4 neighbors (up/down/left/right)","Return count"],
code:`class Solution {
    public int numIslands(char[][] grid) {
        int count = 0;
        for (int r = 0; r < grid.length; r++)
            for (int c = 0; c < grid[0].length; c++)
                if (grid[r][c] == '1') { dfs(grid, r, c); count++; }
        return count;
    }
    private void dfs(char[][] grid, int r, int c) {
        if (r < 0 || r >= grid.length ||
            c < 0 || c >= grid[0].length ||
            grid[r][c] != '1') return;
        grid[r][c] = '0';
        dfs(grid, r+1, c); dfs(grid, r-1, c);
        dfs(grid, r, c+1); dfs(grid, r, c-1);
    }
}`,
insight:"Modifying the grid avoids a separate visited set. If you can't mutate input, use boolean[][] visited.",
mistake:"Incrementing count AFTER DFS — count++ should come BEFORE dfs() in the outer loop so you count the start of each island.",
signal:"'Count connected components in a grid' → flood fill DFS/BFS from each unvisited cell."
},

{id:35,w:2,topic:"Graphs",name:"Clone Graph",diff:"M",tag:"bfs/dfs",
oneliner:"HashMap<Node,Node> maps original→clone. DFS: if clone exists, return it; else create, clone neighbors.",
ds:{name:"HashMap<Node,Node> + DFS",icon:"📋",
why:"HashMap tracks already-cloned nodes — prevents infinite loops in cyclic graphs and provides O(1) lookup of existing clones. Without it, you'd re-clone nodes in cycles indefinitely.",
alt:"BFS with queue: same HashMap, iterative. Both O(V+E).",
cx:["Time: O(V+E)","Space: O(V) for HashMap"]},
intuition:"DFS through the graph. For each node: if it's already been cloned (in map), return the clone. Otherwise create a new clone, register it in the map (BEFORE recursing to handle cycles), then recursively clone all neighbors.",
steps:["Map<Node,Node> cloned = new HashMap<>()","DFS(node): if node in map → return map.get(node)","Create clone. map.put(node, clone) ← before recursing","For each neighbor: clone.neighbors.add(dfs(neighbor))"],
code:`class Solution {
    private Map<Node, Node> cloned = new HashMap<>();

    public Node cloneGraph(Node node) {
        if (node == null) return null;
        if (cloned.containsKey(node)) return cloned.get(node);

        Node clone = new Node(node.val);
        cloned.put(node, clone);  // register BEFORE recursing (cycle safety)

        for (Node neighbor : node.neighbors)
            clone.neighbors.add(cloneGraph(neighbor));

        return clone;
    }
}`,
insight:"Register the clone in the map BEFORE recursing into neighbors — this breaks the cycle in the recursion.",
mistake:"Creating the clone AFTER recursing into neighbors — cyclic graphs cause infinite recursion/stack overflow.",
signal:"'Deep copy a graph with cycles' → HashMap original→clone + DFS, register before recursing."
},

{id:36,w:2,topic:"Graphs",name:"Pacific Atlantic Water Flow",diff:"M",tag:"dfs",
oneliner:"Reverse-flood from both oceans. Cells in both reachable sets can flow to both oceans.",
ds:{name:"boolean[][] reachable + DFS",icon:"🌊",
why:"Forward approach (from each cell, can water reach both oceans?) is O(m²×n²). Reverse is O(m×n): start DFS from ocean borders flowing uphill — any cell reachable from both borders is the answer.",
alt:"BFS from borders: same complexity, iterative. Multi-source BFS is common for this pattern.",
cx:["Time: O(m×n)","Space: O(m×n)"]},
intuition:"Water flows downhill. Reverse it: start from the ocean edges and 'climb uphill'. Any cell reachable from the Pacific border AND the Atlantic border can flow to both oceans.",
steps:["DFS from all Pacific border cells (top row + left col) → pacific[][] reachable","DFS from all Atlantic border cells (bottom row + right col) → atlantic[][] reachable","Collect cells where both pacific[r][c] && atlantic[r][c]","DFS condition: in-bounds, not visited, height >= prev height"],
code:`class Solution {
    int[][] dirs = {{0,1},{0,-1},{1,0},{-1,0}};
    public List<List<Integer>> pacificAtlantic(int[][] h) {
        int m = h.length, n = h[0].length;
        boolean[][] pac = new boolean[m][n], atl = new boolean[m][n];
        for (int r = 0; r < m; r++) { dfs(h,pac,r,0); dfs(h,atl,r,n-1); }
        for (int c = 0; c < n; c++) { dfs(h,pac,0,c); dfs(h,atl,m-1,c); }
        List<List<Integer>> res = new ArrayList<>();
        for (int r = 0; r < m; r++)
            for (int c = 0; c < n; c++)
                if (pac[r][c] && atl[r][c])
                    res.add(Arrays.asList(r, c));
        return res;
    }
    void dfs(int[][] h, boolean[][] vis, int r, int c) {
        vis[r][c] = true;
        for (int[] d : dirs) {
            int nr = r+d[0], nc = c+d[1];
            if (nr>=0 && nr<h.length && nc>=0 && nc<h[0].length
                && !vis[nr][nc] && h[nr][nc] >= h[r][c])
                dfs(h, vis, nr, nc);
        }
    }
}`,
insight:"The reversal trick — start from oceans and flow UPHILL — reduces O(m²n²) to O(mn). A fundamental optimization for 'can reach X' problems.",
mistake:"DFS condition should be h[nr][nc] >= h[r][c] (can flow back uphill) not <= (that's the forward direction).",
signal:"'Cells reachable by two separate flood fills' → reverse DFS from both borders, intersect."
},

{id:37,w:2,topic:"Graphs",name:"Rotting Oranges",diff:"M",tag:"bfs",
oneliner:"Multi-source BFS from all rotten oranges simultaneously. Count fresh oranges; track time (BFS levels).",
ds:{name:"Queue<int[]> Multi-Source BFS",icon:"🍊",
why:"BFS spreads the 'rot' in waves — each wave = 1 minute. Multi-source: start BFS with all initially rotten oranges already in the queue. This correctly handles simultaneous spreading from all sources. O(m×n).",
alt:"DFS: incorrect for this problem — DFS doesn't model simultaneous spreading. BFS is mandatory here.",
cx:["Time: O(m×n)","Space: O(m×n)"]},
intuition:"Think of rotting as a wave spreading outward from all sources at once. BFS simulates this wave — each level of BFS = 1 minute. Start with all rotten oranges in the queue. Count fresh oranges; when all are gone, return time elapsed.",
steps:["Scan grid: add all rotten (2) to queue; count fresh","BFS: each level is 1 minute. For each rotten orange, spread to fresh 4-neighbors","fresh--; add new rotten to queue","Return time if fresh==0, else -1"],
code:`class Solution {
    public int orangesRotting(int[][] grid) {
        int m = grid.length, n = grid[0].length;
        Queue<int[]> q = new LinkedList<>();
        int fresh = 0;
        for (int r = 0; r < m; r++)
            for (int c = 0; c < n; c++) {
                if (grid[r][c] == 2) q.offer(new int[]{r, c});
                if (grid[r][c] == 1) fresh++;
            }
        if (fresh == 0) return 0;
        int[][] dirs = {{0,1},{0,-1},{1,0},{-1,0}};
        int time = 0;
        while (!q.isEmpty() && fresh > 0) {
            time++;
            int size = q.size();
            for (int i = 0; i < size; i++) {
                int[] cell = q.poll();
                for (int[] d : dirs) {
                    int nr = cell[0]+d[0], nc = cell[1]+d[1];
                    if (nr>=0 && nr<m && nc>=0 && nc<n && grid[nr][nc]==1) {
                        grid[nr][nc] = 2;
                        q.offer(new int[]{nr, nc});
                        fresh--;
                    }
                }
            }
        }
        return fresh == 0 ? time : -1;
    }
}`,
insight:"Multi-source BFS (pre-loading all sources) correctly models simultaneous spreading — single-source BFS one-by-one would be wrong.",
mistake:"Not handling the case where fresh==0 initially — should return 0, not -1.",
signal:"'Simultaneous spreading from multiple sources, minimum time' → Multi-source BFS."
},

{id:38,w:2,topic:"Graphs",name:"Course Schedule (Cycle Detection)",diff:"M",tag:"topo",
oneliner:"Directed graph cycle detection. DFS with 3 states: 0=unvisited, 1=in-path (grey), 2=done (black).",
ds:{name:"Adjacency List + int[] state DFS",icon:"📅",
why:"Two-state visited (boolean) can't distinguish between 'done' and 'currently on path'. Three-state: 0=unvisited, 1=visiting (on current DFS path), 2=done. State 1 on re-entry = cycle. State 2 enables memoization (skip already-processed nodes).",
alt:"Kahn's BFS topological sort: count in-degrees, process nodes with 0 in-degree. If not all processed, there's a cycle.",
cx:["Time: O(V+E)","Space: O(V+E)"]},
intuition:"Model courses as a directed graph (prerequisite → course). If there's a cycle, at least one course is its own indirect prerequisite — impossible to complete. 3-state DFS finds the cycle by detecting when we revisit a node that's still being explored.",
steps:["Build adjacency list. int[] state = new int[n] (all 0)","DFS: if state[node]==1 → cycle (return false); if state[node]==2 → done (return true)","state[node]=1; recurse neighbors. state[node]=2; return true","Call DFS on all unvisited nodes"],
code:`class Solution {
    public boolean canFinish(int numCourses, int[][] prereqs) {
        List<List<Integer>> graph = new ArrayList<>();
        for (int i = 0; i < numCourses; i++) graph.add(new ArrayList<>());
        for (int[] p : prereqs) graph.get(p[1]).add(p[0]);

        int[] state = new int[numCourses]; // 0:unvisited 1:visiting 2:done

        for (int i = 0; i < numCourses; i++)
            if (!dfs(graph, state, i)) return false;
        return true;
    }
    boolean dfs(List<List<Integer>> g, int[] state, int node) {
        if (state[node] == 1) return false; // back edge = cycle
        if (state[node] == 2) return true;  // already processed
        state[node] = 1;
        for (int nei : g.get(node))
            if (!dfs(g, state, nei)) return false;
        state[node] = 2;
        return true;
    }
}`,
insight:"State 2 ('done') is memoization — without it you'd re-explore completed nodes and get O(V+E) per node = O(V(V+E)) total.",
mistake:"Using a boolean visited array — can't tell if a node is 'in the current path' vs 'fully explored'. Gives wrong cycle detection.",
signal:"'Can all tasks complete given dependencies?' → 3-state DFS cycle detection."
},

{id:39,w:2,topic:"Graphs",name:"Course Schedule II",diff:"M",tag:"topo",
oneliner:"Same 3-state DFS — append to order AFTER all neighbors done. Reverse result gives topological order.",
ds:{name:"Adjacency List + Stack-based DFS",icon:"📋",
why:"Topological sort via DFS: a node should appear AFTER all its dependencies. Appending after recursing neighbors guarantees dependencies come first. Reversing the appended list gives the correct order.",
alt:"Kahn's BFS: process nodes with in-degree 0, decrement neighbors. More intuitive for some. Both O(V+E).",
cx:["Time: O(V+E)","Space: O(V+E)"]},
intuition:"Same cycle detection as Course Schedule I, but now we also collect the order. When a node is fully explored (state=2), append it to a list. The list in reverse is the valid topological order — each course appears after all its prerequisites.",
steps:["Same 3-state DFS framework","When state[node] becomes 2: order.add(node)","If cycle detected anywhere: return empty array","Reverse and return order array"],
code:`class Solution {
    List<Integer> order = new ArrayList<>();
    public int[] findOrder(int numCourses, int[][] prereqs) {
        List<List<Integer>> g = new ArrayList<>();
        for (int i = 0; i < numCourses; i++) g.add(new ArrayList<>());
        for (int[] p : prereqs) g.get(p[1]).add(p[0]);
        int[] state = new int[numCourses];
        for (int i = 0; i < numCourses; i++)
            if (!dfs(g, state, i)) return new int[]{};
        int[] res = new int[numCourses];
        for (int i = 0; i < numCourses; i++)
            res[i] = order.get(numCourses - 1 - i);
        return res;
    }
    boolean dfs(List<List<Integer>> g, int[] state, int node) {
        if (state[node] == 1) return false;
        if (state[node] == 2) return true;
        state[node] = 1;
        for (int nei : g.get(node))
            if (!dfs(g, state, nei)) return false;
        state[node] = 2;
        order.add(node);  // add AFTER all neighbors processed
        return true;
    }
}`,
insight:"order.add(node) after recursing → prerequisites are added before the courses that depend on them → reversing gives correct order.",
mistake:"Adding node BEFORE recursing (pre-order) → produces reversed order from what you want.",
signal:"'Order tasks given dependencies' → topological sort, DFS append-after pattern."
},

{id:40,w:2,topic:"Graphs",name:"Word Ladder",diff:"H",tag:"bfs",
oneliner:"BFS where each word is a node; edges connect words differing by exactly 1 letter. Shortest path = answer.",
ds:{name:"Queue<String> BFS + HashSet visited",icon:"🔤",
why:"BFS guarantees shortest path in an unweighted graph. Each transformation is one step. HashSet for visited words gives O(1) lookup. Word generation (try all 26 chars at each position) is more efficient than pre-building the full graph.",
alt:"Bidirectional BFS: start from both beginWord and endWord, meet in middle — O(26 × L × N/2) each side, faster in practice.",
cx:["Time: O(26 × L × N)","Space: O(N × L)"]},
intuition:"Model this as a graph: nodes are words, edges connect words differing by 1 character. Shortest path from beginWord to endWord in this graph = minimum transformations. BFS finds shortest path in unweighted graphs.",
steps:["Add wordList to HashSet for O(1) lookup. Queue<String> with beginWord, steps=1","BFS: for each word in current level, try all 26-char replacements at each position","If new word is in wordSet and not visited: add to queue (add to visited immediately)","If new word == endWord: return current steps+1"],
code:`class Solution {
    public int ladderLength(String beginWord, String endWord, List<String> wordList) {
        Set<String> wordSet = new HashSet<>(wordList);
        if (!wordSet.contains(endWord)) return 0;
        Queue<String> q = new LinkedList<>();
        q.offer(beginWord);
        Set<String> visited = new HashSet<>();
        visited.add(beginWord);
        int steps = 1;
        while (!q.isEmpty()) {
            int size = q.size();
            steps++;
            for (int i = 0; i < size; i++) {
                char[] word = q.poll().toCharArray();
                for (int j = 0; j < word.length; j++) {
                    char orig = word[j];
                    for (char c = 'a'; c <= 'z'; c++) {
                        word[j] = c;
                        String next = new String(word);
                        if (next.equals(endWord)) return steps;
                        if (wordSet.contains(next) && !visited.contains(next)) {
                            visited.add(next);
                            q.offer(next);
                        }
                    }
                    word[j] = orig;
                }
            }
        }
        return 0;
    }
}`,
insight:"Generate neighbors by trying all 26 chars at each position — more efficient than comparing every word pair O(N²×L).",
mistake:"Adding words to visited when dequeuing instead of when enqueuing — allows duplicate enqueuing, causing TLE.",
signal:"'Shortest transformation sequence' → BFS on implicit graph, generate neighbors on the fly."
},

{id:41,w:2,topic:"Backtracking",name:"Subsets",diff:"M",tag:"backtrack",
oneliner:"DFS: at each step, either include the current element or skip it. All paths from root to any node = all subsets.",
ds:{name:"List<Integer> path + Backtracking",icon:"🌿",
why:"Backtracking systematically explores all choices. For subsets, each element has exactly two choices: include or exclude. The recursive tree has 2^n leaves — each represents one subset.",
alt:"Iterative bit masking: for each number 0..2^n-1, bit i set = include nums[i]. Same O(n·2^n) but less interview-friendly.",
cx:["Time: O(n·2^n)","Space: O(n) call stack"]},
intuition:"At each index, you make a binary choice: include nums[i] or don't. Recurse with both choices. Every node in the recursion tree (not just leaves) is a valid subset — add path to result at every call.",
steps:["DFS(start, path): result.add(new ArrayList<>(path))","For i from start to n-1: path.add(nums[i]); dfs(i+1, path); path.remove(last)"],
code:`class Solution {
    List<List<Integer>> result = new ArrayList<>();
    public List<List<Integer>> subsets(int[] nums) {
        dfs(nums, 0, new ArrayList<>());
        return result;
    }
    void dfs(int[] nums, int start, List<Integer> path) {
        result.add(new ArrayList<>(path));  // every node is a valid subset
        for (int i = start; i < nums.length; i++) {
            path.add(nums[i]);
            dfs(nums, i + 1, path);
            path.remove(path.size() - 1);  // backtrack
        }
    }
}`,
insight:"Adding path at the START of dfs (before the loop) is what makes every node (not just leaves) a subset.",
mistake:"path.remove(index) removes by index, not value! path.remove(path.size()-1) removes last element correctly.",
signal:"'Generate all subsets/power set' → backtracking, add path at every recursive call."
},

{id:42,w:2,topic:"Backtracking",name:"Combination Sum",diff:"M",tag:"backtrack",
oneliner:"Backtrack with running sum. Pass index i (not i+1) to allow reuse. Prune when sum > target.",
ds:{name:"List<Integer> path + Backtracking",icon:"➕",
why:"Backtracking with pruning explores all valid combinations without generating invalid ones. Passing i (same element) allows unlimited reuse. Sorted input enables early pruning when candidate > remaining target.",
alt:"DP can count combinations but not enumerate them — backtracking is necessary for enumeration.",
cx:["Time: O(N^(T/M)) N=candidates, T=target, M=min","Space: O(T/M) stack depth"]},
intuition:"Try every candidate starting from index i. Add it to the path, reduce remaining target, recurse (with same i — reuse allowed). If remaining = 0, record path. If remaining < 0, prune. Backtrack (remove last element) after returning.",
steps:["Sort candidates (enables pruning). DFS(start, path, remaining)","If remaining==0: result.add(copy of path). If remaining<0: return","For i=start..end: if candidates[i]>remaining: break (sorted, can prune)","path.add; dfs(i, path, remaining-candidates[i]); path.remove(last)"],
code:`class Solution {
    List<List<Integer>> result = new ArrayList<>();
    public List<List<Integer>> combinationSum(int[] candidates, int target) {
        Arrays.sort(candidates);
        dfs(candidates, 0, new ArrayList<>(), target);
        return result;
    }
    void dfs(int[] c, int start, List<Integer> path, int rem) {
        if (rem == 0) { result.add(new ArrayList<>(path)); return; }
        for (int i = start; i < c.length; i++) {
            if (c[i] > rem) break;        // pruning (sorted)
            path.add(c[i]);
            dfs(c, i, path, rem - c[i]); // i not i+1 = reuse allowed
            path.remove(path.size() - 1);
        }
    }
}`,
insight:"Passing i (not i+1) is the single change that allows reuse of the same element — compare with Subsets.",
mistake:"Adding new ArrayList<>(path) vs path directly — path is mutable, all result entries would point to the same empty list at the end.",
signal:"'Find all combinations summing to target, elements reusable' → backtrack, pass i not i+1."
},

{id:43,w:2,topic:"Backtracking",name:"Permutations",diff:"M",tag:"backtrack",
oneliner:"Swap nums[i] with nums[start], recurse, swap back. At start==n, record permutation.",
ds:{name:"In-place Swap + Backtracking",icon:"🔀",
why:"In-place swap avoids a separate 'used' boolean array. Swapping nums[start] with each remaining element places each candidate at position 'start', then recurses on the rest. O(n·n!) time.",
alt:"Used[] boolean array + path list: cleaner but O(n) extra space per call. Both valid.",
cx:["Time: O(n·n!)","Space: O(n) call stack"]},
intuition:"Fix the element at position 'start' by swapping it with each element from start to end. Recurse to fix the next position. When start == n, all positions are fixed — record the permutation. Swap back to restore state (backtrack).",
steps:["If start==nums.length: result.add(copy). Return","For i=start..n-1: swap(nums, start, i); dfs(start+1); swap(nums, start, i)"],
code:`class Solution {
    List<List<Integer>> result = new ArrayList<>();
    public List<List<Integer>> permute(int[] nums) {
        dfs(nums, 0);
        return result;
    }
    void dfs(int[] nums, int start) {
        if (start == nums.length) {
            List<Integer> perm = new ArrayList<>();
            for (int n : nums) perm.add(n);
            result.add(perm);
            return;
        }
        for (int i = start; i < nums.length; i++) {
            swap(nums, start, i);
            dfs(nums, start + 1);
            swap(nums, start, i); // backtrack
        }
    }
    void swap(int[] nums, int a, int b) {
        int tmp = nums[a]; nums[a] = nums[b]; nums[b] = tmp;
    }
}`,
insight:"In-place swap is elegant: position 'start' gets each possible element via swap, and the rest recurse over what's left.",
mistake:"Not copying the array when recording — Arrays.asList(nums) gives a view of the same mutable array.",
signal:"'Generate all permutations' → in-place swap backtracking."
},

{id:44,w:2,topic:"Backtracking",name:"Word Search",diff:"M",tag:"backtrack",
oneliner:"DFS from each cell. Mark visited by mutating board. Restore after backtracking.",
ds:{name:"In-place Board Mutation + DFS",icon:"🔠",
why:"Using the board itself to mark visited cells (temporarily replace with '#') avoids a separate boolean[][] — O(1) extra space per path. Restoring after backtracking is essential.",
alt:"boolean[][] visited: O(m×n) extra space but board stays clean. Both valid.",
cx:["Time: O(m×n×4^L) L=word length","Space: O(L) call stack"]},
intuition:"For every cell that matches word[0], start a DFS. At each step, check current cell matches word[index]. Mark it visited (board[r][c]='#'), recurse in 4 directions for word[index+1], then restore the cell (backtrack).",
steps:["Outer loop: for each (r,c), call dfs(r,c,0)","DFS: if index==word.length(): return true (found!)","Bounds/char/visited check. board[r][c]='#' (mark visited)","Recurse 4 directions for index+1. board[r][c]=orig (restore). Return result"],
code:`class Solution {
    public boolean exist(char[][] board, String word) {
        for (int r = 0; r < board.length; r++)
            for (int c = 0; c < board[0].length; c++)
                if (dfs(board, word, r, c, 0)) return true;
        return false;
    }
    boolean dfs(char[][] b, String w, int r, int c, int i) {
        if (i == w.length()) return true;
        if (r < 0 || r >= b.length || c < 0 || c >= b[0].length
            || b[r][c] != w.charAt(i)) return false;
        char tmp = b[r][c];
        b[r][c] = '#';                     // mark visited
        boolean found = dfs(b,w,r+1,c,i+1) || dfs(b,w,r-1,c,i+1)
                      || dfs(b,w,r,c+1,i+1) || dfs(b,w,r,c-1,i+1);
        b[r][c] = tmp;                     // restore
        return found;
    }
}`,

{id:45,w:2,topic:"Linked Lists",name:"Reverse Linked List",diff:"E",tag:"pointer",
oneliner:"Three pointers: prev=null, curr=head. At each step: save next, point curr.next to prev, advance both.",
ds:{name:"Three Pointers (in-place)",icon:"🔗",
why:"In-place reversal needs only three pointers — prev, curr, next. O(1) extra space. Iterative avoids O(n) stack space of the recursive version.",
alt:"Recursive: elegant but uses O(n) stack space. Avoid for long lists.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"Walk the list. At each node, reverse the pointer (curr.next = prev), then advance. The 'prev' pointer follows behind curr, building the reversed chain.",
steps:["prev=null, curr=head","While curr!=null: next=curr.next; curr.next=prev; prev=curr; curr=next","Return prev (new head)"],
code:`class Solution {
    public ListNode reverseList(ListNode head) {
        ListNode prev = null, curr = head;
        while (curr != null) {
            ListNode next = curr.next;  // save next
            curr.next = prev;           // reverse pointer
            prev = curr;                // advance prev
            curr = next;                // advance curr

    }
}`,

{id:46,w:2,topic:"Linked Lists",name:"Merge Two Sorted Lists",diff:"E",tag:"pointer",
oneliner:"Dummy head node. Compare list heads; attach smaller; advance that list. Append remaining.",
ds:{name:"Dummy Head Node",icon:"🔗",
why:"Dummy head eliminates the special case for initializing the result list's head. All nodes are attached uniformly via tail.next. O(m+n) time, O(1) space.",
alt:"Recursive: clean but O(m+n) stack space.",
cx:["Time: O(m+n)","Space: O(1)"]},
intuition:"Use a dummy head node so you never need to handle 'what is the head of the result?' as a special case. Maintain a tail pointer. At each step, attach the smaller of the two current nodes to tail, advance that list, advance tail.",
steps:["dummy=new ListNode(0); tail=dummy","While l1!=null && l2!=null: attach smaller to tail; advance that list; tail=tail.next","tail.next = whichever list remains (already sorted)","Return dummy.next"],
code:`class Solution {
    public ListNode mergeTwoLists(ListNode l1, ListNode l2) {
        ListNode dummy = new ListNode(0), tail = dummy;
        while (l1 != null && l2 != null) {
            if (l1.val <= l2.val) { tail.next = l1; l1 = l1.next; }
            else                  { tail.next = l2; l2 = l2.next; }
            tail = tail.next;
        }
        tail.next = (l1 != null) ? l1 : l2;
        return dummy.next;
    }
}`,
insight:"Dummy head is the standard trick for linked list construction — removes the 'first node is a special case' problem.",
mistake:"Forgetting tail.next = remaining after the while loop — you'd lose all remaining nodes from the longer list.",
signal:"'Merge/build linked list with clean head init' → dummy head node."
},

{id:47,w:2,topic:"Linked Lists",name:"Linked List Cycle",diff:"E",tag:"fast-slow",
oneliner:"Floyd's cycle detection: slow moves 1 step, fast moves 2. If they meet, there's a cycle.",
ds:{name:"Fast/Slow Pointers (Floyd's)",icon:"🐢🐇",
why:"Two pointers at different speeds. In a cycle, fast gains on slow by 1 step per iteration — they must meet. No extra space vs HashSet approach. O(n) time, O(1) space.",
alt:"HashSet of visited nodes: O(n) space. Floyd's is O(1) — always preferred.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"Imagine a runner on a circular track. A faster runner always laps a slower one. If there's a cycle, fast catches slow. If no cycle, fast reaches null first.",
steps:["slow=head, fast=head","While fast!=null && fast.next!=null: slow=slow.next; fast=fast.next.next","If slow==fast: cycle detected, return true","Return false"],
code:`class Solution {
    public boolean hasCycle(ListNode head) {
        ListNode slow = head, fast = head;
        while (fast != null && fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
            if (slow == fast) return true;
        }
        return false;
    }
}`,
insight:"fast != null checks fast itself; fast.next != null checks before doing fast.next.next — both are needed.",
mistake:"Checking slow==fast BEFORE moving pointers — they start equal (both at head), giving immediate false positive.",
signal:"'Detect cycle in linked list' → fast/slow pointers, Floyd's algorithm."
},

{id:48,w:2,topic:"Linked Lists",name:"LRU Cache",diff:"M",tag:"design",
oneliner:"HashMap for O(1) key lookup + Doubly Linked List for O(1) move-to-front and O(1) eviction.",
ds:{name:"HashMap + Doubly Linked List",icon:"🗃️",
why:"LRU needs O(1) get (HashMap lookup) AND O(1) put/eviction (reorder). Singly linked list can't delete nodes in O(1) without finding predecessor. Doubly linked list with dummy head/tail allows O(1) node removal anywhere.",
alt:"LinkedHashMap in Java handles this natively — valid to mention, but Google expects you to implement it.",
cx:["get: O(1)","put: O(1)","Space: O(capacity)"]},
intuition:"Two structures working together: HashMap maps key → node (for O(1) access); doubly linked list keeps nodes in access order (most recent at head, LRU at tail). On get/put: move node to head. On eviction: remove tail node and its map entry.",
steps:["Node class with key,val,prev,next. Dummy head and tail nodes","get(key): if in map, remove node from list, add to head, return val","put(key,val): if exists update+move to head. Else add at head. If over capacity, remove tail and its map entry"],
code:`class LRUCache {
    class Node {
        int key, val;
        Node prev, next;
        Node(int k, int v) { key=k; val=v; }
    }
    private Map<Integer,Node> map = new HashMap<>();
    private int cap;
    private Node head = new Node(0,0); // dummy MRU end
    private Node tail = new Node(0,0); // dummy LRU end

    public LRUCache(int capacity) {
        cap = capacity;
        head.next = tail; tail.prev = head;
    }
    private void remove(Node n) {
        n.prev.next = n.next; n.next.prev = n.prev;
    }
    private void addFront(Node n) {
        n.next = head.next; n.prev = head;
        head.next.prev = n; head.next = n;
    }
    public int get(int key) {
        if (!map.containsKey(key)) return -1;
        Node n = map.get(key);
        remove(n); addFront(n);
        return n.val;
    }
    public void put(int key, int val) {
        if (map.containsKey(key)) remove(map.get(key));
        Node n = new Node(key, val);
        map.put(key, n); addFront(n);
        if (map.size() > cap) {
            Node lru = tail.prev;
            remove(lru); map.remove(lru.key);
        }
    }
}`,
insight:"Dummy head and tail eliminate ALL null-check edge cases when inserting at the front or removing the last real node.",
mistake:"Not storing the KEY in the Node — when you evict the LRU tail node, you need its key to remove it from the HashMap.",
signal:"'O(1) get/put with LRU eviction' → HashMap + Doubly Linked List with sentinel nodes."
},

{id:49,w:2,topic:"Linked Lists",name:"Merge K Sorted Lists",diff:"H",tag:"heap",
oneliner:"Min-Heap of (value, listNode). Pop minimum, add to result, push its next node. O(n log k).",
ds:{name:"PriorityQueue (Min-Heap of size k)",icon:"🔗",
why:"k sorted lists — you need the global minimum at each step. PriorityQueue holds one node per list (k nodes total). Popping gives the minimum in O(log k); pushing the next node from that list maintains the invariant. O(n log k) total.",
alt:"Merge lists two by two: O(n log k) but more complex code. Brute force (collect all, sort): O(n log n) — loses the sorted property advantage.",
cx:["Time: O(n log k) n=total nodes","Space: O(k) heap"]},
intuition:"At any point, the next node to add to the result is the minimum among the current heads of all k lists. Min-Heap of size k gives this minimum in O(log k). After taking the minimum, push its successor from the same list.",
steps:["PriorityQueue by node value. Push head of each non-null list","While pq not empty: poll() → add to result chain; if node.next!=null: push node.next","Return dummy.next"],
code:`class Solution {
    public ListNode mergeKLists(ListNode[] lists) {
        PriorityQueue<ListNode> pq = new PriorityQueue<>(
            (a, b) -> a.val - b.val
        );
        for (ListNode l : lists)
            if (l != null) pq.offer(l);

        ListNode dummy = new ListNode(0), tail = dummy;
        while (!pq.isEmpty()) {
            ListNode node = pq.poll();
            tail.next = node;
            tail = tail.next;
            if (node.next != null) pq.offer(node.next);
        }
        return dummy.next;
    }
}`,
insight:"Only k nodes are in the heap at any time — O(k) space regardless of total nodes n.",
mistake:"Pushing entire lists into the heap upfront — O(n) space and loses the O(log k) advantage.",
signal:"'Merge k sorted sequences' → Min-Heap, one pointer per sequence."
},

{id:50,w:3,topic:"1D Dynamic Programming",name:"Climbing Stairs",diff:"E",tag:"dp",
oneliner:"dp[i] = dp[i-1] + dp[i-2]. Only need last two values — O(1) space.",
ds:{name:"Two Variables (rolling)",icon:"🪜",
why:"dp[i] only depends on dp[i-1] and dp[i-2]. Keep only two variables instead of an array — O(1) space. Same recurrence as Fibonacci.",
alt:"Full dp[] array: O(n) space, unnecessary.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"To reach step n, you came from step n−1 (took 1 step) or step n−2 (took 2 steps). So ways[n] = ways[n−1] + ways[n−2]. This is exactly Fibonacci starting with ways[1]=1, ways[2]=2.",

code:`class Solution {
    public int climbStairs(int n) {
        if (n <= 2) return n;
        int prev2 = 1, prev1 = 2;
        for (int i = 3; i <= n; i++) {

            prev2 = prev1;

}`,
insight:"Space-optimizing from dp[n] array to two variables is a common interview trick — always mention you can do this.",
mistake:"Returning dp[n-1] (0-indexed) when using a 1-indexed array — off-by-one errors are common here.",

{id:51,w:3,topic:"1D Dynamic Programming",name:"House Robber",diff:"M",tag:"dp",
oneliner:"dp[i] = max(dp[i-1], dp[i-2] + nums[i]). Can't rob adjacent houses. O(1) space with two vars.",
ds:{name:"Two Variables DP",icon:"🏠",
why:"dp[i] = best amount robbing houses 0..i. It depends only on dp[i-1] and dp[i-2] — two variables suffice. Decision at each house: skip it (dp[i-1]) or rob it (dp[i-2] + nums[i]).",
alt:"Full dp array: O(n) space, same logic.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"At each house, you choose: rob it (gaining nums[i] + best from two houses back) or skip it (taking the best from the previous house). Take the maximum of these two choices.",
steps:["prev2=0 (no houses), prev1=0","For each num: curr=Math.max(prev1, prev2+num); prev2=prev1; prev1=curr","Return prev1"],
code:`class Solution {
    public int rob(int[] nums) {
        int prev2 = 0, prev1 = 0;
        for (int num : nums) {
            int curr = Math.max(prev1, prev2 + num);
            prev2 = prev1;
            prev1 = curr;
        }
        return prev1;
    }
}`,
insight:"Initialize prev2=prev1=0 (robbing 0 houses = 0 money). The recurrence handles all cases cleanly.",
mistake:"Initialising with prev1=nums[0] and special-casing n=1. The prev2=prev1=0 initialisation avoids all this.",

{id:52,w:3,topic:"1D Dynamic Programming",name:"House Robber II",diff:"M",tag:"dp",
oneliner:"Circular array: run House Robber twice — once on nums[0..n-2], once on nums[1..n-1]. Take the max.",
ds:{name:"Two-pass DP",icon:"🏘️",
why:"Houses form a circle — first and last can't both be robbed. Break the circle: run House Robber on two subarrays: excluding the last house, and excluding the first. The answer is the max of both.",
alt:"A single pass with additional state tracking — more complex and error-prone.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"The circular constraint means nums[0] and nums[n-1] can't coexist in any solution. So either we include nums[0] (then nums[n-1] is excluded → rob nums[0..n-2]) or nums[n-1] (then nums[0] excluded → rob nums[1..n-1]). Best of both.",
steps:["if n==1: return nums[0]","Helper rob(nums, l, r): runs standard House Robber on nums[l..r]","Return Math.max(rob(nums,0,n-2), rob(nums,1,n-1))"],
code:`class Solution {
    public int rob(int[] nums) {
        int n = nums.length;
        if (n == 1) return nums[0];
        return Math.max(robRange(nums, 0, n-2),
                        robRange(nums, 1, n-1));
    }
    int robRange(int[] nums, int l, int r) {
        int prev2 = 0, prev1 = 0;
        for (int i = l; i <= r; i++) {
            int curr = Math.max(prev1, prev2 + nums[i]);
            prev2 = prev1;
            prev1 = curr;
        }
        return prev1;
    }
}`,
insight:"Breaking circular into two linear subproblems is the key pattern. Handles n=1 edge case before the general logic.",
mistake:"Not handling n==1 — both ranges would be empty/invalid.",
signal:"'Linear DP on circular array' → two runs of linear DP on overlapping subarrays."
},

{id:53,w:3,topic:"1D Dynamic Programming",name:"Coin Change",diff:"M",tag:"dp",
oneliner:"dp[i] = min coins to make amount i. Build from 0 to target. dp[0]=0, rest=∞ initially.",
ds:{name:"1D DP Array",icon:"🪙",
why:"Each amount i is a subproblem: dp[i] = min over all coins c of (dp[i-c] + 1). Bottom-up builds optimal solutions for smaller amounts first. O(amount × |coins|).",
alt:"Top-down recursion with memoization: same complexity, slightly more memory. Bottom-up is cleaner.",
cx:["Time: O(amount × |coins|)","Space: O(amount)"]},
intuition:"Think of it as an unbounded knapsack. For each amount a, try subtracting each coin c. If dp[a-c] is reachable, then dp[a] = min(dp[a], dp[a-c]+1). Build up from amount 0.",
steps:["dp = new int[amount+1] filled with amount+1 (infinity). dp[0]=0","For a=1..amount: for each coin c: if a-c>=0: dp[a]=Math.min(dp[a], dp[a-c]+1)","Return dp[amount]==(amount+1) ? -1 : dp[amount]"],
code:`class Solution {
    public int coinChange(int[] coins, int amount) {
        int[] dp = new int[amount + 1];
        Arrays.fill(dp, amount + 1); // sentinel infinity
        dp[0] = 0;
        for (int a = 1; a <= amount; a++)
            for (int c : coins)
                if (a - c >= 0)
                    dp[a] = Math.min(dp[a], dp[a - c] + 1);
        return dp[amount] > amount ? -1 : dp[amount];
    }
}`,
insight:"Using amount+1 as 'infinity' is neat — any valid answer ≤ amount (worst case: all 1-coins). Comparison dp[amount] > amount detects unreachable.",
mistake:"Initialising dp[0]=1 instead of 0 — dp[0] means 0 coins to make amount 0. This cascades incorrectly.",
signal:"'Minimum coins/steps to make amount, coins reusable' → unbounded knapsack DP."
},

{id:54,w:3,topic:"1D Dynamic Programming",name:"Word Break",diff:"M",tag:"dp",
oneliner:"dp[i]=true if s[0..i] is breakable. For each i, check all j<i where dp[j]=true and s[j..i] in wordSet.",
ds:{name:"boolean[] dp + HashSet",icon:"📝",
why:"HashSet for O(1) word lookup. DP builds breakability bottom-up: dp[i] is true if any split point j gives a true prefix (dp[j]) and a valid word (s[j..i] ∈ wordSet).",
alt:"Memoized DFS from position 0 — same complexity, but DP is cleaner iteratively.",
cx:["Time: O(n² × m) m=avg word len","Space: O(n + |dict|)"]},
intuition:"dp[i] = 'can s[0..i] be word-broken?'. It's true if there exists any j where s[0..j] is breakable (dp[j]) AND s[j..i] is a dictionary word. dp[0]=true is the seed: empty string is always 'broken'.",
steps:["Set<String> wordSet. boolean[] dp = new boolean[n+1]. dp[0]=true","For i=1..n: for j=0..i-1: if dp[j] && wordSet.contains(s.substring(j,i)): dp[i]=true; break","Return dp[n]"],
code:`class Solution {
    public boolean wordBreak(String s, List<String> wordDict) {
        Set<String> wordSet = new HashSet<>(wordDict);
        int n = s.length();
        boolean[] dp = new boolean[n + 1];
        dp[0] = true;
        for (int i = 1; i <= n; i++)
            for (int j = 0; j < i; j++)
                if (dp[j] && wordSet.contains(s.substring(j, i))) {
                    dp[i] = true;
                    break;
                }
        return dp[n];
    }
}`,
insight:"dp[0]=true is the seed of the entire chain — without it, no word at position 0 would ever be considered reachable.",
mistake:"Passing wordDict as List for contains() — O(n) per lookup. Always convert to HashSet first.",
signal:"'Can string be segmented into dictionary words' → DP + HashSet."
},

{id:55,w:3,topic:"1D Dynamic Programming",name:"Decode Ways",diff:"M",tag:"dp",
oneliner:"dp[i] = ways to decode s[0..i-1]. Check single digit (s[i-1]) and two-digit (s[i-2..i-1]).",
ds:{name:"1D DP (rolling two vars)",icon:"🔢",
why:"At each position, you can decode a single digit (if valid: '1'-'9') or two digits (if valid: '10'-'26'). dp[i] = dp[i-1] (single) + dp[i-2] (two-digit). Only last two values needed.",
alt:"Full dp array: O(n) space, same logic. Recursive with memo also valid.",
cx:["Time: O(n)","Space: O(1) with rolling vars"]},
intuition:"At each character, two choices: treat it as a single digit or combine with the previous. Single: valid if s[i]!='0'. Two-digit: valid if s[i-1..i] is 10-26. Count all valid decodings.",
steps:["dp[0]=1 (empty), dp[1]=s[0]!='0'?1:0","For i=2..n: oneDigit=s[i-1], twoDigit=s[i-2..i-1]","If oneDigit valid (!=0): dp[i]+=dp[i-1]","If twoDigit valid (10-26): dp[i]+=dp[i-2]. Return dp[n]"],
code:`class Solution {
    public int numDecodings(String s) {
        int n = s.length();
        int prev2 = 1;  // dp[0]
        int prev1 = s.charAt(0) != '0' ? 1 : 0;  // dp[1]
        if (n == 1) return prev1;
        for (int i = 2; i <= n; i++) {
            int curr = 0;
            int one = s.charAt(i-1) - '0';
            int two = Integer.parseInt(s.substring(i-2, i));
            if (one >= 1) curr += prev1;         // valid single digit
            if (two >= 10 && two <= 26) curr += prev2; // valid two digits
            prev2 = prev1; prev1 = curr;
        }
        return prev1;
    }
}`,
insight:"'0' is the edge case — '0' alone is invalid (no decoding), but '10' and '20' are valid two-digit decodings.",
mistake:"Forgetting that '30'-'99' are invalid two-digit decodings (only 10-26 map to letters).",
signal:"'Count decodings/ways given constraints on consecutive characters' → 1D DP, single+double step."
},

{id:56,w:3,topic:"2D Dynamic Programming",name:"Unique Paths",diff:"M",tag:"2d-dp",
oneliner:"dp[r][c] = dp[r-1][c] + dp[r][c-1]. Robot can only go right or down. Top row and left col = 1.",
ds:{name:"2D DP Array (or 1D rolling)",icon:"📐",
why:"Each cell (r,c) is reachable only from (r-1,c) or (r,c-1). dp[r][c] = sum of ways to reach those two predecessors. Top row and left column have exactly 1 path each (only one direction to come from).",
alt:"Combinatorics: C(m+n-2, m-1) — O(1) math solution. Mention it as a bonus.",
cx:["Time: O(m×n)","Space: O(n) with 1D rolling"]},
intuition:"Every path consists of exactly (m-1) downs and (n-1) rights. DP builds the count bottom-up: ways to reach (r,c) = ways from above + ways from left.",
steps:["dp = int[m][n]. Set row 0 and col 0 to 1 (one way each)","For r=1..m-1, c=1..n-1: dp[r][c]=dp[r-1][c]+dp[r][c-1]","Return dp[m-1][n-1]"],
code:`class Solution {
    public int uniquePaths(int m, int n) {
        int[][] dp = new int[m][n];
        for (int r = 0; r < m; r++) dp[r][0] = 1;
        for (int c = 0; c < n; c++) dp[0][c] = 1;
        for (int r = 1; r < m; r++)
            for (int c = 1; c < n; c++)
                dp[r][c] = dp[r-1][c] + dp[r][c-1];
        return dp[m-1][n-1];
    }
}`,
insight:"Can optimize to O(n) space using a 1D dp array (previous row). dp[c] += dp[c-1] updates in-place.",
mistake:"Not initializing the top row and left column to 1 — they'd remain 0, breaking all subsequent cells.",
signal:"'Count paths in grid with restricted movement' → dp[r][c] = dp[r-1][c] + dp[r][c-1]."
},

{id:57,w:3,topic:"2D Dynamic Programming",name:"Longest Common Subsequence",diff:"M",tag:"2d-dp",
oneliner:"dp[i][j]=LCS of text1[0..i-1] and text2[0..j-1]. Match → extend diagonal; no match → take best skip.",
ds:{name:"2D DP Array",icon:"📊",
why:"Two sequences of lengths m and n. dp[i][j] represents LCS of their first i and j characters. Recurrence: match → dp[i-1][j-1]+1; no match → max(dp[i-1][j], dp[i][j-1]). O(mn) time and space.",
alt:"Space-optimized to O(min(m,n)) using a 1D array with a temp variable.",
cx:["Time: O(m×n)","Space: O(m×n)"]},
intuition:"When characters match, they extend the LCS: dp[i][j] = dp[i-1][j-1] + 1. When they don't, the LCS is determined by the best of: ignoring text1's current char (dp[i-1][j]) or ignoring text2's current char (dp[i][j-1]).",
steps:["dp = int[m+1][n+1] (0-padded borders)","For i=1..m, j=1..n: if text1[i-1]==text2[j-1]: dp[i][j]=dp[i-1][j-1]+1","Else: dp[i][j]=Math.max(dp[i-1][j], dp[i][j-1])","Return dp[m][n]"],
code:`class Solution {
    public int longestCommonSubsequence(String text1, String text2) {
        int m = text1.length(), n = text2.length();
        int[][] dp = new int[m+1][n+1];
        for (int i = 1; i <= m; i++)
            for (int j = 1; j <= n; j++)
                if (text1.charAt(i-1) == text2.charAt(j-1))
                    dp[i][j] = dp[i-1][j-1] + 1;
                else
                    dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        return dp[m][n];
    }
}`,
insight:"1-indexed dp with 0-padded row/column eliminates all boundary checks — standard 2D DP setup.",
mistake:"Confusing LCS (subsequence — chars don't need to be adjacent) with LCS (substring — chars must be adjacent). Different recurrences.",
signal:"'Common subsequence of two sequences' → 2D DP, diagonal extend on match, max skip on mismatch."
},

{id:58,w:3,topic:"2D Dynamic Programming",name:"Edit Distance",diff:"M",tag:"2d-dp",
oneliner:"dp[i][j]=min edits to convert word1[0..i-1] to word2[0..j-1]. Match=diagonal; else 1+min(insert,delete,replace).",
ds:{name:"2D DP Array",icon:"✏️",
why:"Three operations (insert, delete, replace) have optimal substructure. dp[i][j] builds from three adjacent cells, each representing one operation. O(m×n) — unavoidable since all pairs of prefixes may matter.",
alt:"Space-optimized to O(n) with rolling rows.",
cx:["Time: O(m×n)","Space: O(m×n)"]},
intuition:"dp[i][j] = min edits to transform word1[0..i-1] into word2[0..j-1]. If chars match: no edit needed, dp[i][j]=dp[i-1][j-1]. If not: take the cheapest of insert (dp[i][j-1]+1), delete (dp[i-1][j]+1), replace (dp[i-1][j-1]+1).",
steps:["dp[i][0]=i (delete all), dp[0][j]=j (insert all)","If word1[i-1]==word2[j-1]: dp[i][j]=dp[i-1][j-1]","Else: dp[i][j]=1+Math.min(dp[i-1][j-1], Math.min(dp[i-1][j], dp[i][j-1]))","Return dp[m][n]"],
code:`class Solution {
    public int minDistance(String word1, String word2) {
        int m = word1.length(), n = word2.length();
        int[][] dp = new int[m+1][n+1];
        for (int i = 0; i <= m; i++) dp[i][0] = i;
        for (int j = 0; j <= n; j++) dp[0][j] = j;
        for (int i = 1; i <= m; i++)
            for (int j = 1; j <= n; j++)
                if (word1.charAt(i-1) == word2.charAt(j-1))
                    dp[i][j] = dp[i-1][j-1];
                else
                    dp[i][j] = 1 + Math.min(dp[i-1][j-1],
                                   Math.min(dp[i-1][j], dp[i][j-1]));
        return dp[m][n];
    }
}`,
insight:"dp[i-1][j-1]=replace, dp[i-1][j]=delete from word1, dp[i][j-1]=insert into word1. Memorise these three mappings.",
mistake:"Confusing which operation corresponds to which cell neighbor. Draw it out: diagonal=replace, up=delete, left=insert.",
signal:"'Transform one string to another with min edits' → edit distance DP."
},

{id:60,w:3,topic:"Heaps & Priority Queue",name:"Task Scheduler",diff:"M",tag:"heap+greedy",
oneliner:"Most frequent task controls the schedule. Formula: max((maxFreq-1)*(n+1)+countMax, tasks.length).",
ds:{name:"int[26] + Formula",icon:"⏰",
why:"The max-frequency task creates 'slots' in the schedule. All other tasks fill those slots. Remaining slots = idle time. This reduces to a formula — no actual simulation needed.",
alt:"MaxHeap simulation: O(tasks × n). Formula is O(1) after counting — always prefer formula when derivable.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"The task with highest frequency AAAA (n=2) creates slots: A _ _ A _ _ A _ _ A. Fill blanks with other tasks. If blanks run out, other tasks add to the end. Schedule size = max(total tasks, slot structure size).",
steps:["Count frequencies. Find maxFreq and countMax (how many tasks have maxFreq)","slots = (maxFreq-1) * (n+1) + countMax","Return Math.max(tasks.length, slots)"],
code:`class Solution {
    public int leastInterval(char[] tasks, int n) {
        int[] freq = new int[26];
        for (char t : tasks) freq[t - 'A']++;

        int maxFreq = 0;
        for (int f : freq) maxFreq = Math.max(maxFreq, f);

        int countMax = 0;
        for (int f : freq) if (f == maxFreq) countMax++;

        return Math.max(tasks.length,
                        (maxFreq - 1) * (n + 1) + countMax);
    }
}`,
insight:"max(tasks.length, formula) handles the case where other tasks fill all idle slots — then no idle time is needed.",
mistake:"Forgetting the max() with tasks.length — when k is small and many tasks exist, the formula underestimates.",
signal:"'Minimum schedule time with cooldown' → greedy formula based on max frequency."
},

{id:61,w:3,topic:"Heaps & Priority Queue",name:"Find Median from Data Stream",diff:"H",tag:"heap",
oneliner:"Two heaps: maxHeap for lower half, minHeap for upper half. Balance sizes; median is O(1) from tops.",
ds:{name:"Two PriorityQueues (Max-Heap + Min-Heap)",icon:"📊",
why:"Median needs the middle element(s). Two heaps partition the data: maxHeap holds the lower half (max at top), minHeap holds the upper half (min at top). Balanced sizes give O(1) median access. Each add is O(log n).",
alt:"Sorted array with binary search insert: O(n) insert. Two heaps is the standard O(log n) solution.",
cx:["add: O(log n)","findMedian: O(1)","Space: O(n)"]},
intuition:"Lower half in max-heap, upper half in min-heap. Keep them balanced (size difference ≤ 1). If sizes are equal: median = average of both tops. If lower half is bigger: median = maxHeap top.",
steps:["Add to maxHeap (lower). If maxHeap.peek() > minHeap.peek(): rebalance","If |sizes| > 1: move top of larger heap to smaller","findMedian: if equal sizes, avg of tops; else top of larger heap"],
code:`class MedianFinder {
    // max-heap for lower half, min-heap for upper half
    PriorityQueue<Integer> lo = new PriorityQueue<>(Collections.reverseOrder());
    PriorityQueue<Integer> hi = new PriorityQueue<>();

    public void addNum(int num) {
        lo.offer(num);
        // ensure max of lo <= min of hi
        if (!hi.isEmpty() && lo.peek() > hi.peek())
            hi.offer(lo.poll());
        // balance sizes: lo can have at most 1 more than hi
        if (lo.size() > hi.size() + 1)
            hi.offer(lo.poll());
        else if (hi.size() > lo.size())
            lo.offer(hi.poll());
    }

    public double findMedian() {
        if (lo.size() == hi.size())
            return (lo.peek() + hi.peek()) / 2.0;
        return lo.peek();
    }
}`,
insight:"Always add to lo first, then fix the invariant (lo.max ≤ hi.min), then fix balance. Order matters.",
mistake:"Forgetting the partition invariant check (lo.peek() > hi.peek()) — elements can end up in the wrong half.",
signal:"'Running median from stream' → two heaps: max-heap lower half + min-heap upper half."
},

{id:62,w:3,topic:"Greedy & Intervals",name:"Merge Intervals",diff:"M",tag:"intervals",
oneliner:"Sort by start. Walk: if current overlaps with last in result, extend it; else append.",
ds:{name:"int[][] sorted + Linear Merge",icon:"📏",
why:"After sorting by start, any overlap must involve adjacent intervals in the sorted list. One linear scan with the last merged interval in hand is sufficient. O(n log n) for sort, O(n) for merge.",
alt:"Without sorting: O(n²) comparison — unacceptable.",
cx:["Time: O(n log n)","Space: O(n) output"]},
intuition:"Overlapping intervals must be adjacent after sorting by start. Scan left to right: if the next interval starts within the current merged interval, extend the merged interval's end. Otherwise, the current is finalized.",
steps:["Sort by intervals[i][0]","result starts with intervals[0]","For each subsequent [start,end]: if start<=result.last[1]: result.last[1]=Math.max(result.last[1],end)","Else: result.add([start,end])"],
code:`class Solution {
    public int[][] merge(int[][] intervals) {
        Arrays.sort(intervals, (a, b) -> a[0] - b[0]);
        List<int[]> res = new ArrayList<>();
        res.add(intervals[0]);
        for (int i = 1; i < intervals.length; i++) {
            int[] last = res.get(res.size() - 1);
            if (intervals[i][0] <= last[1])
                last[1] = Math.max(last[1], intervals[i][1]);
            else
                res.add(intervals[i]);
        }
        return res.toArray(new int[0][]);
    }
}`,
insight:"Math.max when extending is critical — a fully contained interval [1,10] followed by [3,5] should give [1,10], not [1,5].",
mistake:"Not taking Math.max for the end — contained intervals would incorrectly shrink the merged interval.",
signal:"'Merge overlapping intervals' → sort by start, extend or append."
},

{id:63,w:3,topic:"Greedy & Intervals",name:"Insert Interval",diff:"M",tag:"intervals",
oneliner:"Three phases: add all intervals ending before newInterval starts, merge overlapping, add remaining.",
ds:{name:"Linear Scan (3 phases)",icon:"📌",
why:"No sorting needed (already sorted). Three-phase linear scan: skip non-overlapping intervals before, merge all overlapping in the middle, append the rest. O(n).",
alt:"General merge intervals after inserting — O(n log n). Exploit sorted property for O(n).",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"Phase 1: all intervals that end before newInterval starts — add as-is. Phase 2: all intervals that overlap with newInterval — merge into one. Phase 3: all intervals that start after newInterval ends — add as-is.",
steps:["Phase 1: while i<n && intervals[i][1]<newInterval[0]: add intervals[i++]","Phase 2: while i<n && intervals[i][0]<=newInterval[1]: expand newInterval boundaries; i++","Add merged newInterval. Phase 3: add remaining intervals[i..]"],
code:`class Solution {
    public int[][] insert(int[][] intervals, int[] newInterval) {
        List<int[]> res = new ArrayList<>();
        int i = 0, n = intervals.length;
        // Phase 1: no overlap before
        while (i < n && intervals[i][1] < newInterval[0])
            res.add(intervals[i++]);
        // Phase 2: overlap — merge
        while (i < n && intervals[i][0] <= newInterval[1]) {
            newInterval[0] = Math.min(newInterval[0], intervals[i][0]);
            newInterval[1] = Math.max(newInterval[1], intervals[i][1]);
            i++;
        }
        res.add(newInterval);
        // Phase 3: no overlap after
        while (i < n) res.add(intervals[i++]);
        return res.toArray(new int[0][]);
    }
}`,
insight:"Phase boundary conditions: Phase 1 ends when intervals[i][1] >= newInterval[0] (potential overlap). Phase 2 ends when intervals[i][0] > newInterval[1].",
mistake:"Getting phase boundaries wrong — draw a number line with 'before', 'overlap', 'after' to verify conditions.",
signal:"'Insert into sorted interval list' → three-phase linear scan."
},

why:"At each new meeting, you need the room that ends soonest. Min-heap gives this in O(log k). If the soonest-ending room finishes by the new meeting's start, reuse it (heapReplace). Otherwise, add a new room (heapAdd). Heap size = rooms needed.",

code:`class Solution {

            if (!pq.isEmpty() && pq.peek() <= meeting[0])

{id:66,w:3,topic:"Trie",name:"Implement Trie",diff:"M",tag:"trie",
oneliner:"TrieNode has TrieNode[26] children and boolean isEnd. Insert/search/startsWith walk char by char.",
ds:{name:"TrieNode[26] Array",icon:"🌳",
why:"Fixed alphabet (26 letters) — array indexed by (c-'a') is faster than HashMap and has predictable memory. Each node stores 26 children pointers + isEnd flag. O(L) for all operations where L = word length.",
alt:"HashMap<Character, TrieNode> children: better for large/sparse alphabets (Unicode). int[26] is optimal for lowercase English.",
cx:["Time: O(L) per operation","Space: O(26 × N × L) total"]},
intuition:"A trie is a tree where each path from root to a marked node spells a word. Each edge is a character. Insert: walk/create nodes. Search: walk nodes, check isEnd. StartsWith: walk nodes, return true if all chars found.",
steps:["class TrieNode { TrieNode[] children = new TrieNode[26]; boolean isEnd; }","insert: for each char c: if children[c-'a']==null: create; walk down; set isEnd=true","search: walk nodes; if any null: return false; return node.isEnd","startsWith: walk nodes; if any null: return false; return true"],
code:`class Trie {
    private TrieNode root = new TrieNode();

    class TrieNode {
        TrieNode[] ch = new TrieNode[26];
        boolean isEnd;
    }
    public void insert(String word) {
        TrieNode node = root;
        for (char c : word.toCharArray()) {
            int i = c - 'a';
            if (node.ch[i] == null) node.ch[i] = new TrieNode();
            node = node.ch[i];
        }
        node.isEnd = true;
    }
    public boolean search(String word) {
        TrieNode node = root;
        for (char c : word.toCharArray()) {
            int i = c - 'a';
            if (node.ch[i] == null) return false;
            node = node.ch[i];
        }
        return node.isEnd;
    }
    public boolean startsWith(String prefix) {
        TrieNode node = root;
        for (char c : prefix.toCharArray()) {
            int i = c - 'a';
            if (node.ch[i] == null) return false;
            node = node.ch[i];
        }
        return true;
    }
}`,
insight:"The only difference between search() and startsWith() is the final check: isEnd vs always-true.",
mistake:"Sharing a single root node across multiple Trie instances — root must be per-instance (initialized in the field).",
signal:"'Prefix-based word search, autocomplete, word dictionary' → Trie with TrieNode[26]."
},

{id:67,w:3,topic:"Trie",name:"Design Add and Search Words",diff:"M",tag:"trie+dfs",
oneliner:"Trie insert for addWord. Search: DFS through trie; '.' wildcard tries all 26 children.",
ds:{name:"Trie + DFS for wildcard",icon:"🔍",
why:"Standard trie handles exact search. Wildcard '.' requires trying all possible characters at that position — a DFS branch. Trie structure ensures we only explore valid prefixes.",
alt:"HashMap of sorted word → set of words: handles anagrams but not wildcards efficiently.",
cx:["addWord: O(L)","search: O(26^W_dots × L) worst","Space: O(N×L)"]},
intuition:"Build a standard Trie for addWord. For search, walk character by character. When you hit '.', branch into all 26 possible children via DFS. If any branch returns true, the word exists.",
steps:["Same TrieNode as Implement Trie","addWord: standard trie insert","search: DFS helper — if c=='.': try all 26 children recursively","If c is letter: standard walk. Return node.isEnd at word end"],
code:`class WordDictionary {
    class TrieNode { TrieNode[] ch = new TrieNode[26]; boolean isEnd; }
    TrieNode root = new TrieNode();

    public void addWord(String word) {
        TrieNode node = root;
        for (char c : word.toCharArray()) {
            int i = c - 'a';
            if (node.ch[i] == null) node.ch[i] = new TrieNode();
            node = node.ch[i];
        }
        node.isEnd = true;
    }
    public boolean search(String word) {
        return dfs(word, 0, root);
    }
    boolean dfs(String word, int idx, TrieNode node) {
        if (idx == word.length()) return node.isEnd;
        char c = word.charAt(idx);
        if (c == '.') {
            for (TrieNode child : node.ch)
                if (child != null && dfs(word, idx+1, child))
                    return true;
            return false;
        }
        int i = c - 'a';
        return node.ch[i] != null && dfs(word, idx+1, node.ch[i]);
    }
}`,
insight:"The DFS for '.' short-circuits on first match (return true immediately). In the worst case with all wildcards it's O(26^L) — mention this.",
mistake:"Using iteration for '.' instead of recursion — you'd need to track state for each branch, much messier.",
signal:"'Word dictionary with wildcard '.' search' → Trie + DFS branching on wildcard."
},
