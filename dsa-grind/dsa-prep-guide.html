<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Interview Prep — Java</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap');
:root{
  --bg:#0d0d12;--surface:#14141c;--s2:#1c1c28;--s3:#232336;
  --border:#2a2a3e;--b2:#3a3a52;
  --accent:#5b8ef0;--a2:#9b7ff7;
  --green:#3fd68e;--yellow:#f5c842;--red:#f06f6f;--orange:#f5954a;
  --text:#e4e4f0;--t2:#9898b0;--t3:#5a5a72;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;flex-shrink:0;}
.logo span{color:var(--accent);}
.sw{flex:1;min-width:180px;position:relative;}
.sw input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 32px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
.sw input:focus{border-color:var(--accent);}
.sw input::placeholder{color:var(--t3);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px;}
.stats{display:flex;gap:14px;align-items:center;flex-shrink:0;}
.stat{text-align:center;}
.sn{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--accent);}
.sl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;}
.pbar-wrap{width:110px;}
.pbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
.pbar{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--a2));border-radius:3px;transition:width .4s;}

/* FILTERS */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.flabel{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-right:2px;}
.fsep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.pill{padding:3px 11px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.pill:hover{border-color:var(--b2);color:var(--text);}
.pill.active{background:var(--s2);border-color:var(--accent);color:var(--text);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 95px);}

/* SIDEBAR */
.sidebar{width:265px;flex-shrink:0;border-right:1px solid var(--border);padding:12px 0;position:sticky;top:95px;height:calc(100vh - 95px);overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.wk-lbl{padding:12px 18px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);display:flex;align-items:center;gap:6px;}
.wdot{width:6px;height:6px;border-radius:50%;}
.w1c{background:#5b8ef0;}.w2c{background:#9b7ff7;}.w3c{background:#f06f8e;}.w4c{background:#3fd68e;}
.tg-hdr{width:100%;padding:7px 18px;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;border:none;background:transparent;color:var(--t2);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;transition:color .15s;text-align:left;}
.tg-hdr:hover{color:var(--text);}
.tprog{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;}
.mpb{width:32px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.mpbf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.pnl{padding:2px 0 6px;}
.pni{display:flex;align-items:center;gap:7px;padding:4px 18px 4px 26px;cursor:pointer;transition:background .1s;}
.pni:hover{background:var(--s2);}
.pni.active-nav{background:var(--s2);}
.ncheck{width:13px;height:13px;border:1.5px solid var(--b2);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;transition:all .15s;}
.ncheck.done{background:var(--green);border-color:var(--green);color:#000;}
.nname{flex:1;font-size:11.5px;color:var(--t2);line-height:1.3;}
.pni.active-nav .nname{color:var(--text);}
.nname.solved{text-decoration:line-through;color:var(--t3);}
.ndot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.dE{background:var(--green);}.dM{background:var(--yellow);}.dH{background:var(--red);}

/* MAIN */
.main{flex:1;padding:24px 28px;min-width:0;max-width:880px;}

/* CARD */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;transition:border-color .15s;}
.pcard:hover{border-color:var(--b2);}
.pcard.open{border-color:var(--b2);}

.pchead{padding:14px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none;transition:background .15s;}
.pchead:hover{background:var(--s2);}
.pcard.open .pchead{background:var(--s2);border-bottom:1px solid var(--border);}

.pcnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);padding-top:3px;min-width:22px;}
.pctitle{flex:1;min-width:0;}
.pcname{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.pcmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}

.badge{font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;font-weight:500;}
.bE{background:rgba(63,214,142,.15);color:var(--green);}
.bM{background:rgba(245,200,66,.15);color:var(--yellow);}
.bH{background:rgba(240,111,111,.15);color:var(--red);}
.btag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:var(--s3);color:var(--t3);border:1px solid var(--border);}

.pcactions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ckbtn{width:20px;height:20px;border:1.5px solid var(--b2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .15s;flex-shrink:0;}
.ckbtn.done{background:var(--green);border-color:var(--green);color:#000;}
.ckbtn:hover:not(.done){border-color:var(--green);}
.chev{font-size:11px;color:var(--t3);transition:transform .2s;}
.pcard.open .chev{transform:rotate(180deg);}

/* SOLUTION */
.solbody{display:none;padding:18px 22px;}
.pcard.open .solbody{display:block;}

.ssec{margin-bottom:18px;}
.ssec:last-child{margin-bottom:0;}
.stitle{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.stitle::before{content:'';display:inline-block;width:3px;height:11px;border-radius:2px;background:var(--accent);}

.oneliner{background:linear-gradient(135deg,rgba(91,142,240,.12),rgba(155,127,247,.08));border:1px solid rgba(91,142,240,.25);border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:18px;}
.oneliner::before{content:'⚡ ';}

/* DS CARD */
.dscard{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;}
.dsicon{font-size:22px;flex-shrink:0;width:38px;height:38px;background:var(--s3);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.dsbody{flex:1;min-width:0;}
.dsname{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--a2);margin-bottom:4px;}
.dswhy{font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:5px;}
.dsalt{font-size:12px;color:var(--t2);font-style:italic;padding-left:10px;border-left:2px solid var(--border);margin-top:6px;line-height:1.5;}
.dscx{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.cxchip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--s3);color:var(--t2);border:1px solid var(--border);}

/* INTUITION */
.ibox{background:var(--s2);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text);line-height:1.7;}

/* STEPS */
.steps{display:flex;flex-direction:column;gap:5px;}
.step{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;background:var(--s2);border-radius:7px;font-size:13px;color:var(--text);line-height:1.5;}
.stepn{min-width:20px;height:20px;border-radius:50%;background:rgba(91,142,240,.2);color:var(--accent);font-size:10px;font-weight:600;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

/* CODE */
.code{background:#080810;border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.85;color:#c5c5e0;overflow-x:auto;white-space:pre;}
.kw{color:#9b7ff7;}.fn{color:#5b8ef0;}.str{color:#3fd68e;}.cm{color:#404058;font-style:italic;}.num{color:#f5c842;}.tp{color:#f5954a;}

/* INSIGHT / MISTAKE */
.im-row{display:flex;gap:10px;flex-wrap:wrap;}
.icard{flex:1;min-width:200px;border-left:3px solid var(--accent);background:rgba(91,142,240,.06);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;line-height:1.6;color:var(--text);}
.icard strong{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}
.mcard{flex:1;min-width:200px;border-left:3px solid var(--red);background:rgba(240,111,111,.06);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;line-height:1.6;color:var(--text);}
.mcard strong{color:var(--red);font-size:10px;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}

.sigbox{background:rgba(245,148,74,.08);border:1px solid rgba(245,148,74,.2);border-radius:8px;padding:9px 13px;font-size:13px;color:var(--orange);font-weight:500;}
.sigbox::before{content:'🎯 ';}

.sdiv{height:1px;background:var(--border);margin:16px 0;}
.empty{padding:40px;text-align:center;color:var(--t3);font-size:14px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:768px){.sidebar{display:none;}.main{padding:14px;}}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">DSA <span>Interview</span> — Java Prep</div>
  <div class="sw">
    <span class="si">🔍</span>
    <input type="text" id="q" placeholder="Search problems, patterns, tags..." oninput="applyFilters()">
  </div>
  <div class="stats">
    <div class="stat"><div class="sn" id="done-count">0</div><div class="sl">Done</div></div>
    <div class="stat"><div class="sn" id="total-count">0</div><div class="sl">Total</div></div>
    <div class="pbar-wrap">
      <div class="pbar-lbl"><span>Progress</span><span id="pct">0%</span></div>
      <div class="pbar"><div class="pbar-fill" id="mainbar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="fbar">
  <span class="flabel">Week</span>
  <span class="pill active" onclick="setF('week','All',this)">All</span>
  <span class="pill" onclick="setF('week','1',this)">Week 1</span>
  <span class="pill" onclick="setF('week','2',this)">Week 2</span>
  <span class="pill" onclick="setF('week','3',this)">Week 3</span>
  <span class="pill" onclick="setF('week','4',this)">Week 4</span>
  <div class="fsep"></div>
  <span class="flabel">Diff</span>
  <span class="pill active" onclick="setF('diff','All',this)">All</span>
  <span class="pill" onclick="setF('diff','E',this)">Easy</span>
  <span class="pill" onclick="setF('diff','M',this)">Medium</span>
  <span class="pill" onclick="setF('diff','H',this)">Hard</span>
  <div class="fsep"></div>
  <span class="pill" onclick="setStatus('unsolved')">Unsolved</span>
  <span class="pill" onclick="setStatus('solved')">Solved</span>
  <span class="pill" onclick="setStatus('all')">All</span>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
// COMPLETE PROBLEM DATA — 120 problems, Java solutions
// ─────────────────────────────────────────────────────────────────
const P = [

// ══════════════════════════════════════════════
// WEEK 1 — Arrays & Hashing
// ══════════════════════════════════════════════
{id:1,w:1,topic:"Arrays & Hashing",name:"Two Sum",diff:"E",tag:"hashmap",
oneliner:"HashMap stores complement → index. One pass: check if (target−num) was seen, else store current.",
ds:{name:"HashMap<Integer,Integer>",icon:"🗺️",
why:"For each nums[i] we need to know if (target−nums[i]) was seen before. HashMap gives O(1) average lookup and insert — turning a brute-force O(n²) nested loop into a single O(n) pass.",
alt:"Sorting + two-pointer works in O(n log n) but loses original indices, failing this problem. Brute force O(n²) — never acceptable at Google.",
cx:["Get/Put: O(1) avg","Total: O(n)","Space: O(n)"]},
intuition:"Scan left to right. For each number, its required partner is (target − number). Before storing the current number, check if its partner already lives in the map. If yes, you're done.",
steps:["Create HashMap<Integer,Integer> seen","For each index i: compute comp = target − nums[i]","If seen.containsKey(comp) → return new int[]{seen.get(comp), i}","Else: seen.put(nums[i], i)"],
code:`class Solution {
    public int[] twoSum(int[] nums, int target) {
        Map<Integer, Integer> seen = new HashMap<>();
        for (int i = 0; i < nums.length; i++) {
            int comp = target - nums[i];
            if (seen.containsKey(comp)) {
                return new int[]{seen.get(comp), i};
            }
            seen.put(nums[i], i);
        }
        return new int[]{};
    }
}`,
insight:"Check BEFORE storing — prevents matching a number with itself when target = 2 × nums[i].",
mistake:"Storing nums[i] before checking — seen.get(nums[i]) could return i itself, giving wrong answer.",
signal:"'Find pair with sum X' or 'find complement' → HashMap<Value, Index>."
},

{id:2,w:1,topic:"Arrays & Hashing",name:"Group Anagrams",diff:"M",tag:"hashmap",
oneliner:"Sort each word → use sorted string as HashMap key. All anagrams share the same sorted form.",
ds:{name:"HashMap<String, List<String>>",icon:"🗂️",
why:"Sorting each word creates a canonical fingerprint identical for all its anagrams. HashMap groups them by fingerprint in O(1) amortized access.",
alt:"Character frequency array (int[26]) as key avoids sorting — O(n·k) vs O(n·k log k). Valid optimization worth mentioning in interview.",
cx:["Sort per word: O(k log k)","Total: O(n·k log k)","Space: O(n·k)"]},
intuition:"All anagrams of 'eat' — 'ate', 'tea' — have identical characters. Sort each word and you get the same string ('aet'). Use that as a HashMap key to collect groups.",
steps:["Create HashMap<String, List<String>> map","For each word: char[] arr = word.toCharArray(); Arrays.sort(arr); key = new String(arr)","map.computeIfAbsent(key, k -> new ArrayList<>()).add(word)","Return new ArrayList<>(map.values())"],
code:`class Solution {
    public List<List<String>> groupAnagrams(String[] strs) {
        Map<String, List<String>> map = new HashMap<>();
        for (String s : strs) {
            char[] arr = s.toCharArray();
            Arrays.sort(arr);
            String key = new String(arr);
            map.computeIfAbsent(key, k -> new ArrayList<>()).add(s);
        }
        return new ArrayList<>(map.values());
    }
}`,
insight:"computeIfAbsent is cleaner than checking containsKey + put separately — idiomatic Java.",
mistake:"Using a char array directly as a map key — arrays use reference equality. Always convert to String.",
signal:"'Group/identify equivalent strings by character content' → sort → use as HashMap key."
},

{id:3,w:1,topic:"Arrays & Hashing",name:"Top K Frequent Elements",diff:"M",tag:"hashmap+heap",
oneliner:"Count with HashMap, then Min-Heap of size K: evict least frequent continuously — O(n log k).",
ds:{name:"HashMap + PriorityQueue (Min-Heap)",icon:"📊",
why:"HashMap gives O(n) frequency count. Min-Heap of size K is the classic 'top K' structure — it evicts the minimum, keeping only the K largest. O(n log k) beats full sort O(n log n) when k ≪ n.",
alt:"Bucket sort: buckets[freq] = list of elements, then read top K from high frequencies. O(n) time and space — optimal, mention as follow-up.",
cx:["Count: O(n)","Heap ops: O(n log k)","Space: O(n + k)"]},
intuition:"Counting is easy. Finding top K without sorting uses a min-heap of size K. Push every element; if heap grows beyond K, pop the minimum (least frequent). The K remaining elements are the answer.",
steps:["Count frequencies with HashMap","Create PriorityQueue sorted by frequency ascending (min-heap)","For each entry: offer(entry). If size > k: poll()","Extract remaining elements from heap"],
code:`class Solution {
    public int[] topKFrequent(int[] nums, int k) {
        Map<Integer, Integer> freq = new HashMap<>();
        for (int n : nums)
            freq.merge(n, 1, Integer::sum);

        // min-heap by frequency
        PriorityQueue<int[]> pq = new PriorityQueue<>(
            (a, b) -> a[1] - b[1]
        );
        for (var e : freq.entrySet()) {
            pq.offer(new int[]{e.getKey(), e.getValue()});
            if (pq.size() > k) pq.poll();
        }
        int[] res = new int[k];
        for (int i = 0; i < k; i++)
            res[i] = pq.poll()[0];
        return res;
    }
}`,
insight:"Min-heap of size K is the canonical 'top K' pattern — memorise it. It keeps K largest by evicting the smallest.",
mistake:"Max-heap + poll K times works but is O(n log n). Always prefer min-heap-of-size-K for this class of problem.",
signal:"'Top K by frequency/value/score' → PriorityQueue (min-heap) of size K."
},

{id:4,w:1,topic:"Arrays & Hashing",name:"Product of Array Except Self",diff:"M",tag:"prefix",
oneliner:"Forward pass fills left products; backward pass multiplies in right products using a running variable.",
ds:{name:"Output Array + Running Variable",icon:"➡️",
why:"Division is forbidden and zeros break it. We decompose: result[i] = leftProduct[i] × rightProduct[i]. The left products are built into the output array. The right products are accumulated in a single int — O(1) extra space.",
alt:"Two separate prefix/suffix arrays work but use O(n) extra space. The running-variable approach uses O(1).",
cx:["Time: O(n)","Space: O(1) extra (output excluded)"]},
intuition:"result[i] needs everything except nums[i]. Build left products first (forward pass). Then a second pass from the right multiplies in the right product using a running variable, never needing a separate array.",
steps:["result = new int[n], result[0] = 1","Forward: for i=1..n-1: result[i] = result[i-1] * nums[i-1]","right = 1; Backward: for i=n-1..0: result[i] *= right; right *= nums[i]","Return result"],
code:`class Solution {
    public int[] productExceptSelf(int[] nums) {
        int n = nums.length;
        int[] result = new int[n];
        result[0] = 1;
        for (int i = 1; i < n; i++)           // left products
            result[i] = result[i-1] * nums[i-1];

        int right = 1;
        for (int i = n - 1; i >= 0; i--) {   // right products
            result[i] *= right;
            right *= nums[i];
        }
        return result;
    }
}`,
insight:"The running 'right' variable replaces an entire right-products array — clean and space-optimal.",
mistake:"result[0] must be initialised to 1 (no left product). Forgetting this breaks the entire forward pass.",
signal:"'Product of all except self, no division' → prefix × suffix with running variable."
},

{id:5,w:1,topic:"Arrays & Hashing",name:"Longest Consecutive Sequence",diff:"M",tag:"hashset",
oneliner:"HashSet + only start counting from sequence roots (n−1 not in set) → O(n) without sorting.",
ds:{name:"HashSet<Integer>",icon:"🔵",
why:"Sorting is O(n log n). HashSet gives O(1) lookup — enables O(n) total. Each element is checked as 'sequence start' at most once, and counted forward at most once, giving amortized O(n).",
alt:"Sorting + linear scan: O(n log n) — correct but Google expects O(n) here.",
cx:["Build: O(n)","Total: O(n) amortized","Space: O(n)"]},
intuition:"For each number n, if n−1 is NOT in the set, n is the start of a new sequence. Count up (n+1, n+2…) until the chain breaks. This guard ensures we never re-count from the middle.",
steps:["Add all nums to HashSet","For each n: if (n−1) not in set → sequence start","count = 1; while set.contains(n + count): count++","best = Math.max(best, count)"],
code:`class Solution {
    public int longestConsecutive(int[] nums) {
        Set<Integer> set = new HashSet<>();
        for (int n : nums) set.add(n);
        int best = 0;
        for (int n : set) {
            if (!set.contains(n - 1)) {   // sequence start
                int count = 1;
                while (set.contains(n + count)) count++;
                best = Math.max(best, count);
            }
        }
        return best;
    }
}`,
insight:"Iterating the set (not the array) handles duplicates automatically — duplicate 5s won't each trigger a count.",
mistake:"Iterating over nums instead of set — duplicates cause false starts and degrade to O(n²) worst case.",
signal:"'Longest consecutive run, O(n)' → HashSet + start-of-sequence guard."
},

{id:6,w:1,topic:"Arrays & Hashing",name:"Valid Anagram",diff:"E",tag:"freq-array",
oneliner:"int[26] frequency array: +1 for s, −1 for t. If any count ≠ 0 at end, not anagrams.",
ds:{name:"int[26] Frequency Array",icon:"🔡",
why:"Alphabet is exactly 26 lowercase letters. Fixed-size int[26] indexed by (char−'a') is faster and more memory-efficient than a HashMap — O(1) space, cache-friendly.",
alt:"HashMap<Character,Integer> works but has higher constant factor. Sorting both strings + compare is O(n log n).",
cx:["Time: O(n)","Space: O(1) — 26 fixed slots"]},
intuition:"Anagrams have the same character frequencies. Increment counts for s, decrement for t in the same array. If all counts are zero at the end, every character matches perfectly.",
steps:["if s.length() != t.length(): return false","int[] count = new int[26]","For c in s: count[c-'a']++. For c in t: count[c-'a']--","Return all entries == 0"],
code:`class Solution {
    public boolean isAnagram(String s, String t) {
        if (s.length() != t.length()) return false;
        int[] count = new int[26];
        for (char c : s.toCharArray()) count[c - 'a']++;
        for (char c : t.toCharArray()) count[c - 'a']--;
        for (int x : count) if (x != 0) return false;
        return true;
    }
}`,
insight:"Single array with +1/−1 is cleaner and faster than two separate frequency maps.",
mistake:"Not checking lengths first — 'ab' and 'abc' would pass if you only check counts.",

{id:7,w:1,topic:"Two Pointers",name:"Valid Palindrome",diff:"E",tag:"two-ptr",
oneliner:"Two pointers from both ends; skip non-alphanumeric; compare chars case-insensitively.",
ds:{name:"Two Pointers (in-place)",icon:"↔️",
why:"No extra space needed. Converging pointers from both ends give O(n) time and O(1) space — optimal for in-place string check.",
alt:"Create filtered lowercase string then compare reverse — O(n) space, unnecessary allocation.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"A palindrome reads the same forwards and backwards. Converge two pointers inward, skipping non-alphanumeric characters. Any character mismatch (case-insensitive) means it's not a palindrome.",
steps:["l=0, r=s.length()-1","While l < r: skip non-alphanumeric from both ends (with l<r guard)","If Character.toLowerCase(s.charAt(l)) != toLowerCase(s.charAt(r)): return false","l++, r--. Return true"],
code:`class Solution {
    public boolean isPalindrome(String s) {
        int l = 0, r = s.length() - 1;
        while (l < r) {
            while (l < r && !Character.isLetterOrDigit(s.charAt(l))) l++;
            while (l < r && !Character.isLetterOrDigit(s.charAt(r))) r--;
            if (Character.toLowerCase(s.charAt(l)) !=
                Character.toLowerCase(s.charAt(r))) return false;
            l++; r--;
        }
        return true;
    }
}`,
insight:"Inner while loops must also check l < r — without it, pointers can cross and cause index issues.",
mistake:"Not lowercasing before comparing — 'A' vs 'a' would incorrectly fail.",
signal:"'Is string a palindrome, skip non-alpha' → two pointers converging inward."
},

{id:8,w:1,topic:"Two Pointers",name:"3Sum",diff:"M",tag:"two-ptr",
oneliner:"Sort → fix nums[i] → two-pointer on remaining subarray for pair summing to −nums[i]. Skip duplicates.",
ds:{name:"Sort + Two Pointers",icon:"⚡",
why:"Sorting enables two-pointer logic: if sum is too small move left pointer right; too large move right pointer left. This reduces inner search from O(n²) to O(n), giving O(n²) total for the outer loop.",
alt:"HashSet for duplicate elimination: O(n²) time but O(n) extra space. Two-pointer is O(1) extra space after sorting.",
cx:["Sort: O(n log n)","Search: O(n²)","Space: O(1) extra"]},
intuition:"Fix one number nums[i]. You need two others summing to −nums[i]. That's exactly Two Sum on a sorted subarray — solvable with two pointers. Skip duplicates at both the outer and inner levels to avoid duplicate triplets.",
steps:["Sort the array","For i=0..n-3: skip if i>0 && nums[i]==nums[i-1]","lo=i+1, hi=n-1. While lo<hi: sum=nums[i]+nums[lo]+nums[hi]","sum==0 → add, skip duplicates, lo++ hi--. sum<0 → lo++. sum>0 → hi--"],
code:`class Solution {
    public List<List<Integer>> threeSum(int[] nums) {
        Arrays.sort(nums);
        List<List<Integer>> res = new ArrayList<>();
        for (int i = 0; i < nums.length - 2; i++) {
            if (i > 0 && nums[i] == nums[i-1]) continue;
            int lo = i+1, hi = nums.length-1;
            while (lo < hi) {
                int sum = nums[i] + nums[lo] + nums[hi];
                if (sum == 0) {
                    res.add(Arrays.asList(nums[i], nums[lo], nums[hi]));
                    while (lo < hi && nums[lo] == nums[lo+1]) lo++;
                    while (lo < hi && nums[hi] == nums[hi-1]) hi--;
                    lo++; hi--;
                } else if (sum < 0) lo++;
                else hi--;
            }
        }
        return res;
    }
}`,
insight:"Sorting first is what makes the two-pointer logic correct — without it you can't reason about which direction to move.",
mistake:"Forgetting duplicate skip at the inner pointers — produces duplicate triplets even with outer skip.",
signal:"'Triplets/k-sum, no duplicates, sorted' → sort + fix one + two-pointer on rest."
},

ds:{name:"Two Pointers",icon:"🪣",
why:"Greedy + two-pointer: start with maximum width (l=0, r=n-1). Moving the taller wall inward never helps — min height stays same or shrinks, and width shrinks. Only moving the shorter wall can find a taller one.",
alt:"Brute force O(n²) — unacceptable. Two-pointer is O(n) with O(1) space.",

intuition:"Area = min(height[l], height[r]) × (r−l). Start at maximum width. The shorter wall is the bottleneck — moving it inward is your only chance of finding a taller bottleneck and increasing area.",
steps:["l=0, r=height.length-1, best=0","While l<r: area = Math.min(height[l],height[r]) * (r-l)","best = Math.max(best, area)","if height[l] < height[r]: l++ else r--"],
code:`class Solution {
    public int maxArea(int[] height) {
        int l = 0, r = height.length - 1, best = 0;
        while (l < r) {
            best = Math.max(best,

{id:10,w:1,topic:"Two Pointers",name:"Trapping Rain Water",diff:"H",tag:"two-ptr",

ds:{name:"Two Pointers + Running Max",icon:"🌊",

    public int trap(int[] height) {

{id:12,w:1,topic:"Sliding Window",name:"Longest Substring Without Repeating",diff:"M",tag:"window",
oneliner:"Sliding window with HashMap storing last-seen index. Jump left pointer directly on duplicate.",
ds:{name:"HashMap<Character,Integer> + Two Pointers",icon:"🪟",
why:"Storing the last-seen INDEX (not just presence) lets us jump the left pointer directly to the right position in O(1), instead of crawling character by character.",
alt:"HashSet + crawling left pointer: O(n) total but more iterations. HashMap with index is cleaner.",
cx:["Time: O(n)","Space: O(min(n, 128)) — ASCII chars"]},
intuition:"Expand the window right. The moment a character repeats, the window is invalid. Instead of shrinking one step at a time, jump the left pointer directly past the previous occurrence of the duplicate using its stored index.",
steps:["HashMap<Character,Integer> lastSeen, l=0, best=0","For each r: char c = s.charAt(r)","If lastSeen contains c AND lastSeen.get(c) >= l → l = lastSeen.get(c) + 1","lastSeen.put(c, r); best = max(best, r−l+1)"],
code:`class Solution {
    public int lengthOfLongestSubstring(String s) {
        Map<Character, Integer> lastSeen = new HashMap<>();
        int l = 0, best = 0;
        for (int r = 0; r < s.length(); r++) {
            char c = s.charAt(r);
            if (lastSeen.containsKey(c) && lastSeen.get(c) >= l) {
                l = lastSeen.get(c) + 1;
            }
            lastSeen.put(c, r);
            best = Math.max(best, r - l + 1);
        }
        return best;
    }
}`,
insight:"The `lastSeen.get(c) >= l` guard is critical — the char may be in the map but outside the current window.",
mistake:"Omitting the `>= l` check — a character seen earlier (before the current window) would falsely shrink the window.",
signal:"'Longest substring with character uniqueness constraint' → sliding window + last-seen index map."
},

{id:13,w:1,topic:"Sliding Window",name:"Longest Repeating Character Replacement",diff:"M",tag:"window",
oneliner:"Window is valid if (window size − max frequency) ≤ k. Expand right; shrink left when invalid.",
ds:{name:"int[26] + Two Pointers",icon:"🪟",
why:"int[26] tracks character frequencies in the current window. Key insight: (windowSize − maxFreq) = characters to replace. Keep this ≤ k. O(1) space for the freq array.",
alt:"HashMap is also valid but int[26] is faster for fixed alphabet.",
cx:["Time: O(n)","Space: O(1)"]},
intuition:"You have k replacements. In any window, you'd keep the most frequent character and replace everything else. If (window length − max frequency) > k, you've exceeded your replacement budget — shrink from the left.",
steps:["int[26] count, l=0, maxFreq=0, best=0","For r=0..n-1: count[s[r]-'A']++; maxFreq = max(maxFreq, count[s[r]-'A'])","While (r-l+1) - maxFreq > k: count[s[l]-'A']--; l++","best = max(best, r-l+1)"],
code:`class Solution {
    public int characterReplacement(String s, int k) {
        int[] count = new int[26];
        int l = 0, maxFreq = 0, best = 0;
        for (int r = 0; r < s.length(); r++) {
            count[s.charAt(r) - 'A']++;
            maxFreq = Math.max(maxFreq, count[s.charAt(r) - 'A']);
            while ((r - l + 1) - maxFreq > k) {
                count[s.charAt(l) - 'A']--;
                l++;
            }
            best = Math.max(best, r - l + 1);
        }
        return best;
    }
}`,
insight:"maxFreq never needs to decrease — we only care about finding a window as large as the largest valid window seen so far.",
mistake:"Thinking you need to recompute maxFreq when shrinking — you don't. If maxFreq shrinks the window won't grow.",
signal:"'Longest window after at most K replacements' → window size − max freq ≤ k."
},

{id:14,w:1,topic:"Sliding Window",name:"Minimum Window Substring",diff:"H",tag:"window",
oneliner:"Expand right to collect required chars; once all collected, shrink left while valid; track minimum.",
ds:{name:"HashMap + Formation Counter",icon:"🔍",
why:"Two frequency maps: need (from t) and have (current window). A 'formed' counter tracks how many unique chars are fully satisfied — avoids scanning the map on every step.",
alt:"Could check map equality but that's O(|t|) per step. Formation counter reduces to O(1) per step.",
cx:["Time: O(|s|+|t|)","Space: O(|s|+|t|)"]},
intuition:"Expand right until the window contains all characters of t in required quantities ('formed'). Once formed, try shrinking from the left — record minimum window, then shrink until the window breaks, then expand again.",
steps:["Build need map from t. have map + formed counter","Expand r: update have[c]. If have[c]==need[c]: formed++","While formed==required: update best window; shrink l; if have[s[l]]<need[s[l]]: formed--","Repeat until r reaches end"],
code:`class Solution {
    public String minWindow(String s, String t) {
        if (s.isEmpty() || t.isEmpty()) return "";
        Map<Character,Integer> need = new HashMap<>(), have = new HashMap<>();
        for (char c : t.toCharArray())
            need.merge(c, 1, Integer::sum);
        int required = need.size(), formed = 0;
        int l = 0, minLen = Integer.MAX_VALUE, minL = 0;
        for (int r = 0; r < s.length(); r++) {
            char c = s.charAt(r);
            have.merge(c, 1, Integer::sum);
            if (need.containsKey(c) && have.get(c).equals(need.get(c)))
                formed++;
            while (formed == required) {
                if (r - l + 1 < minLen) { minLen = r - l + 1; minL = l; }
                char lc = s.charAt(l);
                have.merge(lc, -1, Integer::sum);
                if (need.containsKey(lc) && have.get(lc) < need.get(lc))
                    formed--;
                l++;
            }
        }
        return minLen == Integer.MAX_VALUE ? "" : s.substring(minL, minL + minLen);
    }
}`,
insight:"The 'formed' counter tracks unique chars fully satisfied — comparing map entries directly would be O(|t|) per step.",
mistake:"Using == instead of .equals() for Integer comparison — Integer caching only works reliably for values -128 to 127.",
signal:"'Smallest window containing all chars of t' → expand-shrink with formation counter."
},

{id:15,w:1,topic:"Sliding Window",name:"Sliding Window Maximum",diff:"H",tag:"deque",
oneliner:"Monotonic decreasing deque: front always holds the maximum of the current window.",
ds:{name:"ArrayDeque (Monotonic Decreasing)",icon:"📦",
why:"A deque maintains candidate maximums in decreasing order. Adding a new element: pop from back anything smaller (they can never be maximum while this element is in the window). Front is always the window maximum. O(n) total — each element enqueued/dequeued at most once.",
alt:"PriorityQueue + lazy deletion: O(n log n). Deque is optimal at O(n).",
cx:["Time: O(n)","Space: O(k)"]},
intuition:"For each window, the maximum is the leftmost element of a decreasing deque of indices. When you add nums[r], remove all indices from the back whose values are ≤ nums[r] — they can never be maximum while nums[r] is in the window. Remove front if it's outside the window.",
steps:["Deque stores indices. l=0","For r=0..n-1: while deque not empty and nums[deque.peekLast()] <= nums[r]: pollLast()","deque.addLast(r). If deque.peekFirst() < l: pollFirst()","If r >= k-1: result[r-k+1] = nums[deque.peekFirst()]; l++"],
code:`class Solution {
    public int[] maxSlidingWindow(int[] nums, int k) {
        int n = nums.length;
        int[] res = new int[n - k + 1];
        Deque<Integer> dq = new ArrayDeque<>(); // stores indices
        int l = 0;
        for (int r = 0; r < n; r++) {
            // remove smaller elements from back
            while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[r])
                dq.pollLast();
            dq.addLast(r);
            // remove out-of-window index from front
            if (dq.peekFirst() < l) dq.pollFirst();
            // window is full
            if (r >= k - 1) {
                res[r - k + 1] = nums[dq.peekFirst()];
                l++;
            }
        }
        return res;
    }
}`,
insight:"Store indices not values — you need the index to check if the front element is outside the window.",
mistake:"Storing values instead of indices — can't detect when the max element falls outside the window.",
signal:"'Max/min of every sliding window of size k' → monotonic deque of indices."
},

{id:16,w:1,topic:"Binary Search",name:"Binary Search",diff:"E",tag:"binary",
oneliner:"Classic template: l=0, r=n-1, mid=(l+r)/2. Adjust based on comparison with target.",
ds:{name:"Two Pointers on Sorted Array",icon:"🎯",
why:"Sorted array → eliminate half the search space each step. O(log n) time, O(1) space — optimal for static sorted data.",
alt:"Linear scan O(n) — acceptable only when n is tiny or array is nearly random.",
cx:["Time: O(log n)","Space: O(1)"]},
intuition:"Divide the search space in half each step. If nums[mid] == target, done. If target is greater, the left half is useless — search right. If smaller, search left. n elements → at most log₂(n) steps.",
steps:["l=0, r=nums.length-1","While l<=r: mid=(l+r)>>>1 (unsigned shift avoids overflow)","If nums[mid]==target: return mid","If nums[mid]<target: l=mid+1 else r=mid-1. Return -1"],
code:`class Solution {
    public int search(int[] nums, int target) {
        int l = 0, r = nums.length - 1;
        while (l <= r) {
            int mid = l + (r - l) / 2;  // avoids integer overflow
            if (nums[mid] == target) return mid;
            else if (nums[mid] < target) l = mid + 1;
            else r = mid - 1;
        }
        return -1;
    }
}`,
insight:"Use l + (r−l)/2 instead of (l+r)/2 — the latter can overflow when l and r are large int values.",
mistake:"Using mid = (l+r)/2 directly — classic Java integer overflow bug for large arrays.",
signal:"'Search in sorted array' → binary search, O(log n)."
},

{id:17,w:1,topic:"Binary Search",name:"Search a 2D Matrix",diff:"M",tag:"binary",
oneliner:"Treat the m×n matrix as a flat sorted array of size m*n. Map mid index to (mid/n, mid%n).",
ds:{name:"Binary Search (virtual flat array)",icon:"⬜",
why:"Each row is sorted and last element of row i < first element of row i+1 — the whole matrix is one sorted sequence. Binary search on index 0..m*n-1, mapping to 2D coordinates in O(1).",
alt:"Binary search on rows first then columns: two separate O(log m) + O(log n) steps — also valid, same asymptote.",
cx:["Time: O(log(m×n))","Space: O(1)"]},
intuition:"The matrix is essentially a sorted array wrapped into rows. Flatten it conceptually — index i maps to row i/n, col i%n. Run standard binary search on 0..m*n-1.",
steps:["l=0, r=m*n-1","mid=(l+r)/2; row=mid/n; col=mid%n","If matrix[row][col]==target: return true","If matrix[row][col]<target: l=mid+1 else r=mid-1"],
code:`class Solution {
    public boolean searchMatrix(int[][] matrix, int target) {
        int m = matrix.length, n = matrix[0].length;
        int l = 0, r = m * n - 1;
        while (l <= r) {
            int mid = l + (r - l) / 2;
            int val = matrix[mid / n][mid % n];
            if (val == target) return true;
            else if (val < target) l = mid + 1;
            else r = mid - 1;
        }
        return false;
    }
}`,
insight:"mid/n gives row, mid%n gives column — the key arithmetic mapping. Verify this on paper for a 3×4 matrix.",
mistake:"Using mid/m and mid%m — m is rows, n is cols. The modulo should be n (number of columns).",
signal:"'Search in row-column sorted matrix' → virtual flat array binary search."
},

{id:18,w:1,topic:"Binary Search",name:"Koko Eating Bananas",diff:"M",tag:"binary-ans",
oneliner:"Binary search on the ANSWER (speed k), not the array. For each k, verify feasibility in O(n).",
ds:{name:"Binary Search on Answer Space",icon:"🍌",
why:"The answer (speed) has a monotonic property: if speed k works, all speeds > k also work. This monotonicity enables binary search on the answer space [1, max(piles)] rather than the input.",
alt:"Linear scan from 1 to max(piles) — O(n × max(piles)) — too slow for large piles.",
cx:["Time: O(n log max(piles))","Space: O(1)"]},
intuition:"Can Koko finish all piles in h hours at speed k? ceil(pile/k) hours per pile. Summing gives total hours. As k increases, hours needed decreases monotonically — binary search for the minimum k where total hours ≤ h.",
steps:["l=1, r=max(piles), best=r","For each mid: hours = sum(ceil(p/mid) for all p)","If hours <= h: valid, try smaller (r=mid-1, best=mid)","Else: too slow, need faster (l=mid+1). Return best"],
code:`class Solution {
    public int minEatingSpeed(int[] piles, int h) {
        int l = 1, r = 0;
        for (int p : piles) r = Math.max(r, p);
        int best = r;
        while (l <= r) {
            int mid = l + (r - l) / 2;
            long hours = 0;
            for (int p : piles)
                hours += (p + mid - 1) / mid; // ceil(p/mid)
            if (hours <= h) { best = mid; r = mid - 1; }
            else l = mid + 1;
        }
        return best;
    }
}`,
insight:"(p + mid − 1) / mid is the integer ceiling division idiom in Java — avoids Math.ceil() with doubles.",
mistake:"Using int for hours — can overflow when piles are large. Always use long for accumulated sums.",
signal:"'Minimize/maximize X such that condition holds + condition is monotonic' → binary search on answer."
},

cx:["Time: O(log n)","Space: O(1)"]},
intuition:"In a rotated sorted array, one of the two halves at any split is always sorted. The minimum is at the start of the unsorted half (or at nums[l] if the whole window is sorted). Narrow down to the unsorted half each iteration.",
steps:["l=0, r=n-1, best=nums[0]","If nums[l]<=nums[r]: that portion is sorted, best=min(best,nums[l]), break/return","mid=(l+r)/2; best=min(best,nums[mid])","If nums[l]<=nums[mid]: left sorted, go right (l=mid+1). Else: right sorted, go left (r=mid-1)"],
code:`class Solution {
    public int findMin(int[] nums) {
        int l = 0, r = nums.length - 1;
        int best = nums[0];
        while (l <= r) {
            if (nums[l] <= nums[r]) {
                best = Math.min(best, nums[l]);
                break;
            }
            int mid = l + (r - l) / 2;
            best = Math.min(best, nums[mid]);
            if (nums[l] <= nums[mid]) l = mid + 1;  // left sorted
            else r = mid - 1;                        // right sorted
        }
        return best;
    }
}`,
insight:"nums[l] <= nums[r] means the current segment is fully sorted — minimum is nums[l], no need to go deeper.",
mistake:"Using strict < instead of <= when comparing nums[l] to nums[mid] — misclassifies equal elements.",
signal:"'Find minimum in rotated sorted array' → binary search, search unsorted half."
},

{id:20,w:1,topic:"Binary Search",name:"Search in Rotated Sorted Array",diff:"M",tag:"binary",
oneliner:"One half is always sorted — check if target falls in it; search there, else search the other half.",
ds:{name:"Binary Search (two-case logic)",icon:"🔄",
why:"Rotation doesn't break binary search — it just requires identifying the sorted half first. One of the two halves is always fully sorted, giving a range check on the target.",
alt:"Find pivot first then binary search twice — same asymptote but two passes.",
cx:["Time: O(log n)","Space: O(1)"]},
intuition:"At any mid split, one half must be sorted. Check: is the left half sorted? (nums[l] <= nums[mid]). If yes, check if target is in [nums[l], nums[mid]]; if so search left, else search right. Vice versa for right half.",
steps:["l=0, r=n-1","If nums[mid]==target: return mid","If nums[l]<=nums[mid] (left sorted): target in [nums[l],nums[mid])? r=mid-1 else l=mid+1","Else (right sorted): target in (nums[mid],nums[r]]? l=mid+1 else r=mid-1"],
code:`class Solution {
    public int search(int[] nums, int target) {
        int l = 0, r = nums.length - 1;
        while (l <= r) {
            int mid = l + (r - l) / 2;
            if (nums[mid] == target) return mid;
            if (nums[l] <= nums[mid]) {          // left half sorted
                if (nums[l] <= target && target < nums[mid])
                    r = mid - 1;
                else
                    l = mid + 1;
            } else {                             // right half sorted
                if (nums[mid] < target && target <= nums[r])
                    l = mid + 1;
                else
                    r = mid - 1;
            }
        }
        return -1;
    }
}`,
insight:"Always identify the SORTED half first — that's what gives you the reliable range check.",
mistake:"Getting the boundary conditions wrong (< vs <=). Draw a concrete 5-element rotated example to verify.",
signal:"'Search target in rotated sorted array' → identify sorted half, check range, recurse."
},

{id:21,w:1,topic:"Stack",name:"Valid Parentheses",diff:"E",tag:"stack",
oneliner:"Push open brackets; on closing bracket, check and pop matching open from stack top.",
ds:{name:"Deque<Character> as Stack",icon:"📚",
why:"Stack (LIFO) perfectly models nested bracket matching — the most recently opened bracket must be the first to close. Java recommends Deque over Stack class for stack operations.",
alt:"Array-based stack (int[] + pointer) is slightly faster but less readable. Deque is idiomatic.",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"Open brackets need to be closed in reverse order of opening. Stack gives LIFO — the last opened bracket is at the top, exactly where you need it when a close bracket arrives.",
steps:["Deque<Character> stack","For each char: if open bracket → push","If close bracket: if stack empty OR stack.peek() != matching open → return false; else pop","Return stack.isEmpty()"],
code:`class Solution {
    public boolean isValid(String s) {
        Deque<Character> stack = new ArrayDeque<>();
        for (char c : s.toCharArray()) {
            if (c == '(' || c == '{' || c == '[') {
                stack.push(c);
            } else {
                if (stack.isEmpty()) return false;
                char top = stack.pop();
                if (c == ')' && top != '(') return false;
                if (c == '}' && top != '{') return false;
                if (c == ']' && top != '[') return false;
            }
        }
        return stack.isEmpty();
    }
}`,
insight:"return stack.isEmpty() at the end — a string like '(((' has no mismatches but leaves unclosed brackets.",
mistake:"Not checking stack.isEmpty() before peek/pop — throws EmptyStackException on strings starting with ')'.",
signal:"'Matching nested brackets/tags' → Stack (LIFO)."
},

{id:22,w:1,topic:"Stack",name:"Min Stack",diff:"M",tag:"stack",
oneliner:"Two stacks: main stack + min-stack that pushes current minimum at each step.",
ds:{name:"Two Stacks",icon:"📚",
why:"A single stack can't provide O(1) min — you'd need to scan. A parallel min-stack stores the running minimum at every level, so getMin() is always O(1) by peeking the min-stack.",
alt:"Stack of pairs (value, currentMin) — same idea, single stack, more object allocation.",
cx:["All ops: O(1)","Space: O(n)"]},
intuition:"The minimum can only change when you push a new value ≤ current min. Maintain a parallel min-stack: when you push x, also push min(x, minStack.peek()) to the min-stack. When you pop, pop both. minStack.peek() is always the current minimum.",
steps:["Two stacks: stack and minStack","push(x): stack.push(x); minStack.push(Math.min(x, minStack.isEmpty()?x:minStack.peek()))","pop(): stack.pop(); minStack.pop()","getMin(): return minStack.peek()"],
code:`class MinStack {
    private Deque<Integer> stack = new ArrayDeque<>();
    private Deque<Integer> minStack = new ArrayDeque<>();

    public void push(int val) {
        stack.push(val);
        int curMin = minStack.isEmpty() ? val
                     : Math.min(val, minStack.peek());
        minStack.push(curMin);
    }

    public void pop() {
        stack.pop();
        minStack.pop();
    }

    public int top() { return stack.peek(); }

    public int getMin() { return minStack.peek(); }
}`,
insight:"The min-stack stores current minimum AT EACH DEPTH — not just global min. This is what makes pop() correct.",
mistake:"Only pushing to minStack when a new minimum is found — popping would then desync the two stacks.",
signal:"'O(1) min/max with push/pop' → parallel min/max stack mirroring the main stack."
},

{id:23,w:1,topic:"Stack",name:"Daily Temperatures",diff:"M",tag:"mono-stack",
oneliner:"Monotonic decreasing stack of indices. When a warmer day arrives, pop and compute the gap.",
ds:{name:"Deque<Integer> Monotonic Stack",icon:"🌡️",
why:"Stack maintains indices of days 'waiting for a warmer day' in decreasing temperature order. A new warmer day resolves all waiting days in the stack top — O(n) total since each index is pushed and popped at most once.",
alt:"Brute force: O(n²). Monotonic stack: O(n) — a classic improvement pattern.",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"Each day waits for its next warmer day. A decreasing stack holds pending days. When today is warmer than the stack top, the top's wait is over — record the gap. Pop and check the next candidate.",
steps:["Deque<Integer> stack (stores indices), int[] result","For each i: while stack not empty AND temps[stack.peek()] < temps[i]: pop idx; result[idx] = i − idx","Push i onto stack","Remaining elements in stack have answer 0 (default)"],
code:`class Solution {
    public int[] dailyTemperatures(int[] temperatures) {
        int n = temperatures.length;
        int[] result = new int[n];
        Deque<Integer> stack = new ArrayDeque<>(); // indices
        for (int i = 0; i < n; i++) {
            while (!stack.isEmpty() &&
                   temperatures[stack.peek()] < temperatures[i]) {
                int idx = stack.pop();
                result[idx] = i - idx;
            }
            stack.push(i);
        }
        return result; // unfound indices remain 0
    }
}`,
insight:"Storing INDICES (not temperatures) is essential — you need to compute the gap and write to result[idx].",
mistake:"Storing temperatures in the stack — you'd lose track of which day they correspond to.",
signal:"'Next greater element to the right' → monotonic decreasing stack."
},

{id:24,w:1,topic:"Stack",name:"Largest Rectangle in Histogram",diff:"H",tag:"mono-stack",
oneliner:"Monotonic increasing stack. When a shorter bar arrives, pop and compute the rectangle it forms.",
ds:{name:"Deque<int[]> Monotonic Stack (index+height)",icon:"📊",
why:"For each bar, its max rectangle extends left until a shorter bar blocks it. Monotonic increasing stack processes this in O(n): when a shorter bar arrives it terminates all taller pending bars, which can extend leftward to the last popped bar's position.",
alt:"Divide and conquer: O(n log n) average. Monotonic stack: O(n) — optimal.",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"A bar at height h can extend left as far as the last bar shorter than h. When a shorter bar i arrives, it terminates all taller bars. The trick: the popped bar's left boundary extends back to wherever the previously popped bar was.",
steps:["Stack of [startIndex, height]. For each bar:","While stack top height > current height: pop [idx, ht]; width = i − idx; area = ht × width; update best","Set start = popped idx (current bar can extend leftward to there)","Push [start, height]. After loop: process remaining stack with right boundary = n"],
code:`class Solution {
    public int largestRectangleArea(int[] heights) {
        int n = heights.length, best = 0;
        Deque<int[]> stack = new ArrayDeque<>(); // [startIdx, height]
        for (int i = 0; i < n; i++) {
            int start = i;
            while (!stack.isEmpty() && stack.peek()[1] > heights[i]) {
                int[] top = stack.pop();
                best = Math.max(best, top[1] * (i - top[0]));
                start = top[0]; // extend leftward
            }
            stack.push(new int[]{start, heights[i]});
        }
        // process remaining bars — extend to right edge
        while (!stack.isEmpty()) {
            int[] top = stack.pop();
            best = Math.max(best, top[1] * (n - top[0]));
        }
        return best;
    }
}`,
insight:"The 'extend leftward' trick (start = popped index) is what makes this O(n) — each popped bar transfers its leftward reach to the current bar.",
mistake:"Forgetting to drain the remaining stack after the loop — bars never terminated remain valid to the right edge.",
signal:"'Max rectangle in histogram' → monotonic increasing stack tracking extendable start positions."
},

{id:25,w:2,topic:"Binary Trees",name:"Invert Binary Tree",diff:"E",tag:"dfs",
oneliner:"DFS: swap left and right children at every node recursively.",

why:"Tree problems naturally decompose recursively: invert the left subtree, invert the right, swap. The call stack acts as the traversal structure. O(n) time, O(h) space.",
alt:"BFS (queue): iterative level-order traversal, swap children as you visit. Same complexity.",
cx:["Time: O(n)","Space: O(h) call stack"]},
intuition:"To invert a tree, invert the left subtree, invert the right subtree, then swap them. Base case: null node returns null. The recursion handles the rest automatically.",

code:`class Solution {
    public TreeNode invertTree(TreeNode root) {
        if (root == null) return null;

        TreeNode right = invertTree(root.right);

        root.right = left;
        return root;
    }
}`,
insight:"The recursive structure is self-explanatory — the function definition IS the algorithm. Interviewers love this for its clarity.",
mistake:"Forgetting to assign the return values — calling invertTree(root.left) without capturing the result modifies the subtree but the reference at the parent isn't updated.",

},

{id:27,w:2,topic:"Binary Trees",name:"Diameter of Binary Tree",diff:"E",tag:"dfs",
oneliner:"At each node: diameter candidate = leftHeight + rightHeight. Track global max; return height upward.",
ds:{name:"DFS with Global Maximum",icon:"📏",
why:"The diameter through a node = height of left subtree + height of right subtree. But the overall diameter might not pass through the root — we need to check every node. DFS + a single int[] max accumulates the answer.",
alt:"Two separate passes: one for height, one for diameter — O(n²). Single DFS is O(n).",
cx:["Time: O(n)","Space: O(h)"]},
intuition:"The longest path might go through any node in the tree. At each node, compute the heights of both subtrees. Their sum is the diameter through this node. The function returns height to the parent, but updates a global max.",
steps:["int[] max = {0}","DFS returns height. At each node: left=dfs(left), right=dfs(right)","max[0] = Math.max(max[0], left+right)","Return 1 + Math.max(left, right)"],
code:`class Solution {
    private int max = 0;
    public int diameterOfBinaryTree(TreeNode root) {
        dfs(root);
        return max;
    }
    private int dfs(TreeNode node) {
        if (node == null) return 0;
        int left  = dfs(node.left);
        int right = dfs(node.right);
        max = Math.max(max, left + right);
        return 1 + Math.max(left, right);
    }
}`,
insight:"The function serves dual purpose: returns height to the parent AND updates the diameter globally. These are two separate concerns handled in one pass.",
mistake:"Returning left+right as the answer from dfs — that's the diameter, not the height. The parent needs height.",

},

{id:28,w:2,topic:"Binary Trees",name:"Balanced Binary Tree",diff:"E",tag:"dfs",
oneliner:"DFS returns height; if any subtree is unbalanced, propagate −1 as a sentinel up the tree.",
ds:{name:"DFS with Sentinel Value",icon:"⚖️",
why:"We need height AND balance status from each subtree. Instead of returning two values, use −1 as a sentinel meaning 'unbalanced'. Any node receiving −1 immediately propagates it upward — one O(n) pass.",
alt:"Compute height for every node separately: O(n²). Sentinel approach: O(n).",
cx:["Time: O(n)","Space: O(h)"]},
intuition:"At each node: get heights of both subtrees. If either is −1 (unbalanced), return −1. If |leftHeight − rightHeight| > 1, this node is unbalanced — return −1. Otherwise return 1 + max(heights) as usual.",
steps:["DFS returns int: actual height, or −1 if unbalanced","If node==null: return 0","left = dfs(left); right = dfs(right)","If left==-1 || right==-1 || |left-right|>1: return -1","Else return 1+Math.max(left,right)"],
code:`class Solution {
    public boolean isBalanced(TreeNode root) {
        return dfs(root) != -1;
    }
    private int dfs(TreeNode node) {
        if (node == null) return 0;
        int left  = dfs(node.left);
        int right = dfs(node.right);
        if (left == -1 || right == -1) return -1;
        if (Math.abs(left - right) > 1)  return -1;
        return 1 + Math.max(left, right);
    }
}`,
insight:"The sentinel −1 propagates the unbalanced signal all the way up without needing a separate boolean field.",
mistake:"Computing height in a separate method — that's O(n²). Always combine height + balance check in one DFS.",
signal:"'Check tree property + need height' → DFS returning height with sentinel for invalid state."
},

{id:29,w:2,topic:"Binary Trees",name:"Binary Tree Level Order Traversal",diff:"M",tag:"bfs",
oneliner:"BFS with Queue. Snapshot queue size before each level — process exactly that many nodes per level.",
ds:{name:"Queue<TreeNode> (BFS)",icon:"📦",
why:"BFS is the natural structure for level-by-level traversal. Queue (FIFO) ensures nodes are processed in the order they were encountered. Snapshot of queue size isolates level boundaries.",
alt:"DFS with level index as parameter: also O(n) but less intuitive for level grouping.",
cx:["Time: O(n)","Space: O(n) — queue holds widest level"]},
intuition:"BFS processes nodes in breadth-first order. Before processing each level, snapshot the queue size — that's exactly how many nodes are in the current level. Process that many, collecting their values, then move to the next level.",
steps:["Queue<TreeNode> q. Add root","While q not empty: int size=q.size(); List<Integer> level=new ArrayList<>()","For i=0..size-1: node=q.poll(); level.add(val); add children to q","result.add(level)"],
code:`class Solution {
    public List<List<Integer>> levelOrder(TreeNode root) {
        List<List<Integer>> result = new ArrayList<>();
        if (root == null) return result;
        Queue<TreeNode> q = new LinkedList<>();
        q.offer(root);
        while (!q.isEmpty()) {
            int size = q.size();            // snapshot!
            List<Integer> level = new ArrayList<>();
            for (int i = 0; i < size; i++) {
                TreeNode node = q.poll();
                level.add(node.val);
                if (node.left  != null) q.offer(node.left);
                if (node.right != null) q.offer(node.right);
            }
            result.add(level);
        }
        return result;
    }
}`,
insight:"The size snapshot is the only mechanism separating levels — without it all nodes would end up in one list.",
mistake:"Using q.size() inside the loop condition — size changes as you add children. Snapshot once before the loop.",
signal:"'Process tree level by level' → BFS with pre-loop size snapshot."
},

{id:30,w:2,topic:"Binary Trees",name:"Binary Tree Right Side View",diff:"M",tag:"bfs",
oneliner:"BFS level order; last node of each level is visible from the right side.",
ds:{name:"Queue<TreeNode> (BFS)",icon:"👁️",
why:"Level-order BFS naturally groups nodes by level. The last node processed in each level is the rightmost — visible from the right. No complex logic needed beyond level-order traversal.",
alt:"DFS: go right first, track depth. First node seen at each new depth is the rightmost. O(n), O(h) space.",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"Imagine looking at the tree from the right. At each level, only the rightmost node is visible. Level-order BFS gives nodes left-to-right per level — the last one at each level is our answer.",
steps:["BFS level order (same as level order traversal)","At each level: after processing all size nodes, the last node's value is the right side view for that level","result.add(lastNode.val)"],
code:`class Solution {
    public List<Integer> rightSideView(TreeNode root) {
        List<Integer> result = new ArrayList<>();
        if (root == null) return result;
        Queue<TreeNode> q = new LinkedList<>();
        q.offer(root);
        while (!q.isEmpty()) {
            int size = q.size();
            TreeNode last = null;
            for (int i = 0; i < size; i++) {
                last = q.poll();
                if (last.left  != null) q.offer(last.left);
                if (last.right != null) q.offer(last.right);
            }
            result.add(last.val);
        }
        return result;
    }
}`,
insight:"'last' is naturally the rightmost node at each level — no extra logic needed.",
mistake:"Adding node.val inside the loop (getting all nodes) instead of just the last one per level.",
signal:"'Right/left side view of tree' → BFS, collect last/first node per level."
},

{id:31,w:2,topic:"Binary Trees",name:"Lowest Common Ancestor of BST",diff:"M",tag:"bst",
oneliner:"BST property: if both p,q < root → go left. Both > root → go right. Else → current node is LCA.",
ds:{name:"BST Property (iterative)",icon:"🌲",
why:"BST ordering eliminates recursive overhead. Iterative approach: follow the BST property to navigate directly to the LCA without visiting unnecessary nodes. O(h) time.",
alt:"Generic tree LCA (post-order DFS) works but ignores BST property — O(n). Always exploit BST ordering.",
cx:["Time: O(h) — O(log n) balanced, O(n) worst","Space: O(1) iterative"]},
intuition:"In a BST, if both p and q are less than the current node, LCA must be in the left subtree. If both greater, go right. The first node where p and q are on different sides (or one equals the node) IS the LCA.",
steps:["While root != null:","If p.val < root.val AND q.val < root.val: root = root.left","If p.val > root.val AND q.val > root.val: root = root.right","Else: return root (split point — this is the LCA)"],
code:`class Solution {
    public TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {
        while (root != null) {
            if (p.val < root.val && q.val < root.val)
                root = root.left;
            else if (p.val > root.val && q.val > root.val)
                root = root.right;
            else
                return root; // split point found
        }
        return null;
    }
}`,
insight:"The iterative version uses O(1) space vs O(h) for recursive — prefer iterative in interviews when easy to write.",
mistake:"Using the general LCA approach (post-order DFS) for a BST — you're ignoring valuable ordering information.",
signal:"'LCA in BST' → follow BST property; split point is the LCA."
},

{id:32,w:2,topic:"Binary Trees",name:"Binary Tree Max Path Sum",diff:"H",tag:"dfs",
oneliner:"At each node: candidate = node + max(0,left) + max(0,right). Return node + max(0, one arm) upward.",
ds:{name:"DFS with Global Max",icon:"🔥",
why:"The max path can go through any node, using at most one arm in each direction. DFS bottom-up: compute the best single-arm contribution upward, while tracking the best two-arm path (the actual answer) globally.",
alt:"No simpler approach — must visit every node and consider all path options.",
cx:["Time: O(n)","Space: O(h)"]},
intuition:"A path through a node can use its left arm, right arm, both, or neither. When returning to the parent you can only bring ONE arm. So: globally track (node + leftArm + rightArm) as the diameter candidate; return (node + max arm) to the parent.",
steps:["int[] max = {Integer.MIN_VALUE}","DFS: left=max(0,dfs(node.left)); right=max(0,dfs(node.right))","max[0] = Math.max(max[0], node.val + left + right) ← two-arm candidate","Return node.val + Math.max(left, right) ← best single arm to parent"],
code:`class Solution {
    private int max = Integer.MIN_VALUE;
    public int maxPathSum(TreeNode root) {
        dfs(root);
        return max;
    }
    private int dfs(TreeNode node) {
        if (node == null) return 0;
        int left  = Math.max(0, dfs(node.left));  // clamp negatives
        int right = Math.max(0, dfs(node.right));
        max = Math.max(max, node.val + left + right); // two-arm path
        return node.val + Math.max(left, right);      // one arm to parent
    }
}`,
insight:"max(0, arm) is the key: a negative arm makes the path worse — just don't include it.",
mistake:"Initialising max to 0 — fails for all-negative trees (answer should be the least negative node).",
signal:"'Max path in binary tree (can start/end anywhere)' → DFS, two-arm candidate, one-arm return."
},

{id:33,w:2,topic:"Binary Trees",name:"Serialize and Deserialize Binary Tree",diff:"H",tag:"design",
oneliner:"BFS serialize to comma-separated string with 'N' for nulls. BFS deserialize rebuilds level by level.",
ds:{name:"Queue<TreeNode> (BFS)",icon:"💾",
why:"BFS level-order encoding with explicit null markers is self-describing: the positions of 'N' tokens tell you exactly where null children are. Reconstruction replays BFS using the same token sequence.",
alt:"Preorder DFS with null markers also works — slightly simpler to code recursively.",
cx:["Time: O(n)","Space: O(n)"]},
intuition:"Serialize: BFS, append each node's value or 'N' for null. Deserialize: split the string, build root from token[0], then use a queue — for each dequeued node, consume the next two tokens as its left and right children.",
steps:["Serialize: BFS, StringBuilder. Append node.val or 'N', comma-separated","Deserialize: split by ','. Build root from vals[0]. Queue of TreeNodes","For each node: left child = vals[i++] (null if 'N'); right = vals[i++]","Return root"],
code:`public class Codec {
    public String serialize(TreeNode root) {
        if (root == null) return "";
        StringBuilder sb = new StringBuilder();
        Queue<TreeNode> q = new LinkedList<>();
        q.offer(root);
        while (!q.isEmpty()) {
            TreeNode node = q.poll();
            if (node == null) { sb.append("N,"); continue; }
            sb.append(node.val).append(",");
            q.offer(node.left);
            q.offer(node.right);
        }
        return sb.toString();
    }

    public TreeNode deserialize(String data) {
        if (data.isEmpty()) return null;
        String[] vals = data.split(",");
        TreeNode root = new TreeNode(Integer.parseInt(vals[0]));
        Queue<TreeNode> q = new LinkedList<>();
        q.offer(root);
        int i = 1;
        while (!q.isEmpty()) {
            TreeNode node = q.poll();
            if (!vals[i].equals("N")) {
                node.left = new TreeNode(Integer.parseInt(vals[i]));
                q.offer(node.left);
            }
            i++;
            if (!vals[i].equals("N")) {
                node.right = new TreeNode(Integer.parseInt(vals[i]));
                q.offer(node.right);
            }
            i++;
        }
        return root;
    }
}`,
insight:"BFS order is self-describing with null markers — the exact position of 'N' tells you the tree structure unambiguously.",
mistake:"Preorder serialize without null markers: different trees (e.g., [1,2] left-child vs right-child) produce the same output.",
signal:"'Encode/decode tree to string' → BFS with null markers, replay in deserialize."
},
