{id:68,w:4,topic:"Hard Mixed",name:"N-Queens",diff:"H",tag:"backtrack",
oneliner:"Place queens row by row. Track cols, diagonals (r-c), anti-diagonals (r+c) in HashSets. Backtrack.",
ds:{name:"HashSet (3 sets) + Backtracking",icon:"♛",
why:"Conflict check needs O(1) lookup for: column already used, diagonal (r-c constant on a diagonal), anti-diagonal (r+c constant). Three HashSets provide this. O(n!) time (pruned), O(n) space.",
alt:"boolean arrays instead of sets: same complexity, slightly faster constants.",
cx:["Time: O(n!) pruned","Space: O(n)"]},
intuition:"Place one queen per row. At each row, try every column. A cell is safe if its column, diagonal (row-col), and anti-diagonal (row+col) are all free. If safe, place the queen, recurse to next row, then remove (backtrack).",
steps:["cols, diag, antiDiag = HashSets","DFS(row): if row==n: record board; return","For col=0..n-1: if col/row-col/row+col in any set: skip","Add to all sets; place queen; dfs(row+1); remove; unplace"],
code:`class Solution {
    List<List<String>> res = new ArrayList<>();
    Set<Integer> cols = new HashSet<>(), diag = new HashSet<>(), anti = new HashSet<>();
    char[][] board;
    public List<List<String>> solveNQueens(int n) {
        board = new char[n][n];
        for (char[] row : board) Arrays.fill(row, '.');
        dfs(0, n);
        return res;
    }
    void dfs(int row, int n) {
        if (row == n) {
            List<String> sol = new ArrayList<>();
            for (char[] r : board) sol.add(new String(r));
            res.add(sol);
            return;
        }
        for (int col = 0; col < n; col++) {
            if (cols.contains(col) || diag.contains(row-col)
                || anti.contains(row+col)) continue;
            cols.add(col); diag.add(row-col); anti.add(row+col);
            board[row][col] = 'Q';
            dfs(row+1, n);
            board[row][col] = '.';
            cols.remove(col); diag.remove(row-col); anti.remove(row+col);
        }
    }
}`,
insight:"row-col is constant along a diagonal; row+col is constant along an anti-diagonal. These are the O(1) conflict identifiers.",
mistake:"Using a 2D boolean board for conflict checking — O(n) per check. Three sets give O(1).",
signal:"'Place N queens with no conflicts' → backtracking, 3 HashSets for O(1) conflict check."
},

{id:69,w:4,topic:"Hard Mixed",name:"Word Search II",diff:"H",tag:"trie+backtrack",
oneliner:"Build Trie from words. DFS on board: follow Trie nodes. When isEnd, record word. Prune dead Trie branches.",
ds:{name:"Trie + DFS Backtracking",icon:"🔠",
why:"Checking all words independently via DFS would be O(words × m × n × 4^L). Trie shares common prefixes — all words with prefix 'APP' share the same Trie path, so we explore that path only once. Massive pruning.",
alt:"Individual DFS for each word: O(W × m × n × 4^L) — TLE for large inputs.",
cx:["Build: O(W×L)","Search: O(m×n×4^L) pruned heavily by Trie"]},
intuition:"Build a Trie from all target words. DFS on the board, walking down the Trie simultaneously. At each cell, follow the Trie edge for that character. If you reach a word end, record it. If no Trie edge exists, prune that branch immediately.",
steps:["Build Trie from words list","DFS(r,c,node): bounds/visited check. If node.ch[c-'a']==null: return (prune)","Walk to child. If child.isEnd: add child.word to result; clear to avoid duplicates","Mark visited; recurse 4 dirs; unmark (backtrack)"],
code:`class Solution {
    class TrieNode {
        TrieNode[] ch = new TrieNode[26];
        String word;
    }
    public List<String> findWords(char[][] board, String[] words) {
        TrieNode root = new TrieNode();
        for (String w : words) {
            TrieNode node = root;
            for (char c : w.toCharArray()) {
                int i = c - 'a';
                if (node.ch[i] == null) node.ch[i] = new TrieNode();
                node = node.ch[i];
            }
            node.word = w; // store word at end node
        }
        List<String> res = new ArrayList<>();
        int m = board.length, n = board[0].length;
        for (int r = 0; r < m; r++)
            for (int c = 0; c < n; c++)
                dfs(board, r, c, root, res);
        return res;
    }
    void dfs(char[][] b, int r, int c, TrieNode node, List<String> res) {
        if (r<0||r>=b.length||c<0||c>=b[0].length||b[r][c]=='#') return;
        char ch = b[r][c];
        TrieNode next = node.ch[ch - 'a'];
        if (next == null) return; // prune!
        if (next.word != null) { res.add(next.word); next.word = null; }
        b[r][c] = '#';
        dfs(b,r+1,c,next,res); dfs(b,r-1,c,next,res);
        dfs(b,r,c+1,next,res); dfs(b,r,c-1,next,res);
        b[r][c] = ch;
    }
}`,
insight:"Storing the word string in the TrieNode (not isEnd boolean) lets you collect the word directly without reconstructing it from the path.",
mistake:"Not setting next.word = null after finding a word — duplicate results if the same word can be found via multiple paths.",
signal:"'Find all words from list in grid' → Trie (prefix pruning) + DFS backtracking."
},

{id:70,w:4,topic:"Hard Mixed",name:"Burst Balloons",diff:"H",tag:"interval-dp",
oneliner:"dp[l][r]=max coins from bursting all balloons strictly between l and r. Think: last to burst in range.",
ds:{name:"2D DP (Interval DP)",icon:"🎈",
why:"Key insight: think about which balloon is LAST to burst in range [l,r]. When balloon k is last, nums[l]*nums[k]*nums[r] is guaranteed (l and r are still present as boundaries). This eliminates dependencies between subproblems.",
alt:"Recursive with memo (top-down) — same complexity, often easier to write for interval DP.",
cx:["Time: O(n³)","Space: O(n²)"]},
intuition:"Add boundary balloons (value 1) at both ends. dp[l][r] = max coins from balloons strictly between l and r. For each possible 'last balloon k' in (l,r): coins = dp[l][k] + nums[l]*nums[k]*nums[r] + dp[k][r]. The 'last burst' framing avoids order dependencies.",
steps:["Pad nums with 1 at both ends. dp[n+2][n+2]","For length=2..n+1: for each l: r=l+length","For k=l+1..r-1: dp[l][r]=max(dp[l][r], dp[l][k]+nums[l]*nums[k]*nums[r]+dp[k][r])","Return dp[0][n+1]"],
code:`class Solution {
    public int maxCoins(int[] nums) {
        int n = nums.length;
        int[] padded = new int[n + 2];
        padded[0] = padded[n+1] = 1;
        for (int i = 0; i < n; i++) padded[i+1] = nums[i];
        int N = n + 2;
        int[][] dp = new int[N][N];
        // len = number of elements in range (l, r) exclusive
        for (int len = 2; len < N; len++) {
            for (int l = 0; l < N - len; l++) {
                int r = l + len;
                for (int k = l+1; k < r; k++) {
                    dp[l][r] = Math.max(dp[l][r],
                        dp[l][k] + padded[l]*padded[k]*padded[r] + dp[k][r]);
                }
            }
        }
        return dp[0][n+1];
    }
}`,
insight:"'Last to burst' reframing is the key that makes subproblems independent. 'First to burst' creates overlapping dependencies.",
mistake:"Thinking about which balloon to burst first (too many dependencies). Always think LAST in interval DP.",
signal:"'Optimal order to process items where order matters' → interval DP, think about which is LAST."
},

{id:71,w:4,topic:"Hard Mixed",name:"Median of Two Sorted Arrays",diff:"H",tag:"binary",
oneliner:"Binary search on partition point in smaller array. Partition both so left halves contain (m+n)/2 elements.",
ds:{name:"Binary Search on Partition",icon:"⚖️",
why:"Merging then finding median is O(m+n). Binary search on partition is O(log min(m,n)) — required by the problem. We binary search the partition point in the smaller array; the partition in the larger follows automatically.",
alt:"Merge arrays, find middle: O(m+n) — too slow for this problem's O(log(m+n)) requirement.",
cx:["Time: O(log min(m,n))","Space: O(1)"]},
intuition:"A median partition divides all elements into two equal halves. Binary search for the right partition in the smaller array (partition i) — the larger array's partition (j) follows: j = (m+n+1)/2 - i. Validate: maxLeft1 ≤ minRight2 and maxLeft2 ≤ minRight1.",
steps:["Ensure nums1 is smaller. Binary search on i (0..m)","j = (m+n+1)/2 - i. Check partition validity","If maxLeft1 > minRight2: i too large (r=mid-1). If maxLeft2 > minRight1: i too small (l=mid+1)","Valid: return based on even/odd total length"],
code:`class Solution {
    public double findMedianSortedArrays(int[] nums1, int[] nums2) {
        if (nums1.length > nums2.length) return findMedianSortedArrays(nums2, nums1);
        int m = nums1.length, n = nums2.length;
        int l = 0, r = m;
        while (l <= r) {
            int i = (l + r) / 2;
            int j = (m + n + 1) / 2 - i;
            int maxL1 = (i == 0) ? Integer.MIN_VALUE : nums1[i-1];
            int minR1 = (i == m) ? Integer.MAX_VALUE : nums1[i];
            int maxL2 = (j == 0) ? Integer.MIN_VALUE : nums2[j-1];
            int minR2 = (j == n) ? Integer.MAX_VALUE : nums2[j];
            if (maxL1 <= minR2 && maxL2 <= minR1) {
                if ((m + n) % 2 == 1)
                    return Math.max(maxL1, maxL2);
                return (Math.max(maxL1, maxL2) + Math.min(minR1, minR2)) / 2.0;
            } else if (maxL1 > minR2) r = i - 1;
            else l = i + 1;
        }
        return 0;
    }
}`,
insight:"Integer.MIN_VALUE and MAX_VALUE as sentinels for boundary partitions (i=0 or i=m) eliminate all if-null checks.",
mistake:"Not ensuring nums1 is the shorter array — binary search must be on the smaller array to keep j valid (j ≥ 0).",
signal:"'Median of two sorted arrays in O(log n)' → binary search on partition."
},

{id:72,w:4,topic:"Hard Mixed",name:"Word Break II",diff:"H",tag:"dp+backtrack",
oneliner:"Backtracking with memoization: memo[i]=list of all sentence suffixes from index i. Reuse on repeat visits.",
ds:{name:"HashMap<Integer, List<String>> Memo + Backtracking",icon:"📝",
why:"Pure backtracking is exponential. Overlapping subproblems: the same index can be the start of many paths. Memoizing all valid sentence completions from each index reduces repeated work.",
alt:"Bottom-up DP can check EXISTENCE (Word Break I) but not enumerate — backtracking is necessary for all sentences.",
cx:["Time: O(n × 2^n) worst","Space: O(2^n) for results"]},
intuition:"From each index, try all words starting there. If a word matches, recurse from the end of that word. Memoize: memo[i] = all valid sentence completions starting at index i. If we revisit index i, return memo[i] immediately.",
steps:["dfs(start): if in memo → return memo.get(start)","If start==n → return List.of('')","For end=start+1..n: if s[start..end] in wordSet: for each suffix in dfs(end): result.add(word + ' ' + suffix)","memo.put(start, result); return result"],
code:`class Solution {
    Map<Integer, List<String>> memo = new HashMap<>();
    public List<String> wordBreak(String s, List<String> wordDict) {
        Set<String> wordSet = new HashSet<>(wordDict);
        return dfs(s, wordSet, 0);
    }
    List<String> dfs(String s, Set<String> wordSet, int start) {
        if (memo.containsKey(start)) return memo.get(start);
        List<String> res = new ArrayList<>();
        if (start == s.length()) { res.add(""); return res; }
        for (int end = start+1; end <= s.length(); end++) {
            String word = s.substring(start, end);
            if (wordSet.contains(word)) {
                for (String suffix : dfs(s, wordSet, end)) {
                    res.add(word + (suffix.isEmpty() ? "" : " " + suffix));
                }
            }
        }
        memo.put(start, res);
        return res;
    }
}`,
insight:"The empty string '' sentinel at the base case propagates upward cleanly — it's what allows the first word to be formed without a leading space.",
mistake:"Forgetting memo.put BEFORE returning (or missing it entirely) — re-explores the same subproblems.",
signal:"'Enumerate all valid segmentations' → backtracking + memoization on position."
},

{id:73,w:4,topic:"Hard Mixed",name:"Alien Dictionary",diff:"H",tag:"topo",
oneliner:"Compare adjacent words to extract character ordering edges. Topological sort the resulting directed graph.",
ds:{name:"Adjacency List + Topological Sort (Kahn's BFS)",icon:"🔤",
why:"Character ordering is expressed as a directed graph. Topological sort gives a valid ordering. Kahn's BFS (in-degree approach) is intuitive here: nodes with 0 in-degree have no prerequisites — process them first.",
alt:"DFS topological sort: also O(V+E). Both valid. Kahn's is more intuitive for many.",
cx:["Time: O(C) C=total chars in all words","Space: O(1) — 26 chars max"]},
intuition:"Compare adjacent words in the list. Find the FIRST character that differs between them — that character comes before the other in the alien alphabet. Collect all such (a→b) edges. Topological sort the 26-character graph.",
steps:["Build adjacency list and in-degree map for all characters appearing in words","Compare adjacent word pairs: first differing char gives an edge. Check invalid case (prefix mismatch)","Kahn's BFS: process all 0-in-degree chars. Return order if all chars processed, else '' (cycle)"],
code:`class Solution {
    public String alienOrder(String[] words) {
        Map<Character,Set<Character>> adj = new HashMap<>();
        Map<Character,Integer> inDeg = new HashMap<>();
        for (String w : words)
            for (char c : w.toCharArray()) {
                adj.putIfAbsent(c, new HashSet<>());
                inDeg.putIfAbsent(c, 0);
            }
        for (int i = 0; i < words.length-1; i++) {
            String w1 = words[i], w2 = words[i+1];
            int minLen = Math.min(w1.length(), w2.length());
            if (w1.length() > w2.length() && w1.startsWith(w2)) return "";
            for (int j = 0; j < minLen; j++) {
                if (w1.charAt(j) != w2.charAt(j)) {
                    char from = w1.charAt(j), to = w2.charAt(j);
                    if (!adj.get(from).contains(to)) {
                        adj.get(from).add(to);
                        inDeg.merge(to, 1, Integer::sum);
                    }
                    break;
                }
            }
        }
        Queue<Character> q = new LinkedList<>();
        for (char c : inDeg.keySet())
            if (inDeg.get(c) == 0) q.offer(c);
        StringBuilder sb = new StringBuilder();
        while (!q.isEmpty()) {
            char c = q.poll(); sb.append(c);
            for (char nei : adj.get(c)) {
                inDeg.merge(nei, -1, Integer::sum);
                if (inDeg.get(nei) == 0) q.offer(nei);
            }
        }
        return sb.length() == inDeg.size() ? sb.toString() : "";
    }
}`,
insight:"The invalid case: if w1 is longer than w2 and w1 starts with w2 (e.g., 'abc' before 'ab'), that's impossible in a valid dictionary.",
mistake:"Breaking after finding the FIRST differing character is critical — subsequent chars tell you nothing about ordering.",
signal:"'Derive ordering from sorted examples' → compare adjacent pairs → topological sort."
},

{id:74,w:4,topic:"Hard Mixed",name:"Trapping Rain Water (2D matrix)",diff:"H",tag:"heap",
oneliner:"Min-heap BFS from all border cells inward. Water at each cell = max(0, currentMin - height[r][c]).",
ds:{name:"PriorityQueue (Min-Heap) + BFS",icon:"🌊",
why:"The water level at any interior cell is bounded by the minimum height of its path to the boundary. Min-heap always processes the current shortest boundary, expanding inward — guarantees we process cells in order of their constraining height.",
alt:"The 1D version uses two pointers. 2D requires min-heap — two-pointer doesn't generalize to 2D.",
cx:["Time: O(m×n log(m×n))","Space: O(m×n)"]},
intuition:"Think of filling the matrix with water from outside. The minimum-height border cell is where water can escape. BFS inward: if a neighbor is shorter than the current cell's water level, water fills up to that level. Push neighbors with their effective water height.",
steps:["Add all border cells to min-heap. Mark visited.","Poll minimum [h,r,c]. For each unvisited neighbor: water += max(0, h-height[nr][nc])","Push [max(h, height[nr][nc]), nr, nc] to heap","Return total water"],
code:`class Solution {
    public int trapRainWater(int[][] heightMap) {
        if (heightMap.length < 3 || heightMap[0].length < 3) return 0;
        int m = heightMap.length, n = heightMap[0].length;
        boolean[][] vis = new boolean[m][n];
        PriorityQueue<int[]> pq = new PriorityQueue<>((a,b)->a[0]-b[0]);
        for (int r = 0; r < m; r++) {
            pq.offer(new int[]{heightMap[r][0],r,0}); vis[r][0]=true;
            pq.offer(new int[]{heightMap[r][n-1],r,n-1}); vis[r][n-1]=true;
        }
        for (int c = 1; c < n-1; c++) {
            pq.offer(new int[]{heightMap[0][c],0,c}); vis[0][c]=true;
            pq.offer(new int[]{heightMap[m-1][c],m-1,c}); vis[m-1][c]=true;
        }
        int[][] dirs = {{0,1},{0,-1},{1,0},{-1,0}};
        int water = 0;
        while (!pq.isEmpty()) {
            int[] cell = pq.poll();
            for (int[] d : dirs) {
                int nr = cell[1]+d[0], nc = cell[2]+d[1];
                if (nr<0||nr>=m||nc<0||nc>=n||vis[nr][nc]) continue;
                vis[nr][nc] = true;
                water += Math.max(0, cell[0] - heightMap[nr][nc]);
                pq.offer(new int[]{Math.max(cell[0],heightMap[nr][nc]),nr,nc});
            }
        }
        return water;
    }
}`,
insight:"Push max(current height, neighbor height) to the heap — this propagates the water level constraint inward correctly.",
mistake:"Applying the 1D two-pointer approach to 2D — water can escape from any direction in 2D, not just left/right.",
signal:"'Trap rain water in 2D grid' → min-heap BFS from all borders inward."
}
]; // end PROBLEMS array

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
let activeWeek='All', activeDiff='All', activeStatus='all';
let solved = {};
const TOPICS_ORDER = [...new Set(P.map(p=>p.topic))];

function storageKey(id){ return `gswe_v3_${id}`; }
function loadSolved(){
  P.forEach(p=>{ try{ solved[p.id]=localStorage.getItem(storageKey(p.id))==='true'; }catch(e){ solved[p.id]=false; } });
}
function saveSolved(id,val){
  solved[id]=val;
  try{ localStorage.setItem(storageKey(id),val); }catch(e){}
}

// ─────────────────────────────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────────────────────────────
function setF(type,val,el){
  if(type==='week') activeWeek=val;
  else activeDiff=val;
  el.closest('.fbar').querySelectorAll('.pill').forEach(p=>{
    if(p.textContent.trim().replace('Week ','')===val.replace('Week ','') ||
       p.textContent.trim()===val||
       (val==='E'&&p.textContent==='Easy')||(val==='M'&&p.textContent==='Medium')||(val==='H'&&p.textContent==='Hard'))
      p.classList.add('active');
    else if(type==='week'&&['All','Week 1','Week 2','Week 3','Week 4'].includes(p.textContent.trim()))
      p.classList.remove('active');
    else if(type==='diff'&&['All','Easy','Medium','Hard'].includes(p.textContent.trim()))
      p.classList.remove('active');
  });
  render();
}
function setStatus(s){ activeStatus=s; render(); }
function applyFilters(){ render(); }

function filtered(){
  const q=(document.getElementById('q')||{}).value||'';
  return P.filter(p=>{
    const wMatch=activeWeek==='All'||String(p.w)===activeWeek;
    const dMatch=activeDiff==='All'||p.diff===activeDiff;
    const sMatch=activeStatus==='all'||(activeStatus==='solved'&&solved[p.id])||(activeStatus==='unsolved'&&!solved[p.id]);
    const qMatch=!q||p.name.toLowerCase().includes(q.toLowerCase())||p.topic.toLowerCase().includes(q.toLowerCase())||p.tag.includes(q.toLowerCase());
    return wMatch&&dMatch&&sMatch&&qMatch;
  });
}

// ─────────────────────────────────────────────────────────────────
// SIDEBAR
// ─────────────────────────────────────────────────────────────────
function buildSidebar(){
  const sb=document.getElementById('sidebar');
  const WEEKS=[{w:1,label:'Week 1 — Arrays & Core',cls:'w1c'},{w:2,label:'Week 2 — Trees & Graphs',cls:'w2c'},{w:3,label:'Week 3 — DP & Heaps',cls:'w3c'},{w:4,label:'Week 4 — Hard Mixed',cls:'w4c'}];
  let html='';
  const filt=filtered();
  const filtIds=new Set(filt.map(p=>p.id));
  WEEKS.forEach(({w,label,cls})=>{
    const weekProbs=P.filter(p=>p.w===w);
    if(!weekProbs.some(p=>filtIds.has(p.id))) return;
    html+=`<div class="wk-lbl"><span class="wdot ${cls}"></span>${label}</div>`;
    const topics=[...new Set(weekProbs.map(p=>p.topic))];
    topics.forEach(topic=>{
      const tp=weekProbs.filter(p=>p.topic===topic&&filtIds.has(p.id));
      if(!tp.length) return;
      const done=tp.filter(p=>solved[p.id]).length;
      const pct=Math.round(done/tp.length*100);
      html+=`<div class="topic-group"><button class="tg-hdr"><span>${topic}</span><span class="tprog"><span>${done}/${tp.length}</span><span class="mpb"><span class="mpbf" style="width:${pct}%"></span></span></span></button>
      <div class="pnl">${tp.map(p=>`<div class="pni" id="nav-${p.id}" onclick="scrollToCard(${p.id})">
        <div class="ncheck ${solved[p.id]?'done':''}">${solved[p.id]?'✓':''}</div>
        <div class="nname ${solved[p.id]?'solved':''}">${p.name}</div>
        <div class="ndot d${p.diff}"></div>
      </div>`).join('')}</div></div>`;
    });
  });
  sb.innerHTML=html||'<div class="empty" style="padding:20px;font-size:12px">No problems match filters</div>';
}

function scrollToCard(id){
  const el=document.getElementById('card-'+id);
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); }
}

// ─────────────────────────────────────────────────────────────────
// MAIN RENDER
// ─────────────────────────────────────────────────────────────────
function render(){
  buildSidebar();
  const main=document.getElementById('main');
  const filt=filtered();
  if(!filt.length){ main.innerHTML='<div class="empty">No problems match your current filters.</div>'; updateStats(); return; }
  let html='', lastTopic='';
  filt.forEach((p,idx)=>{
    if(p.topic!==lastTopic){
      if(idx>0) html+='</div>';
      lastTopic=p.topic;
    }
    html+=cardHTML(p,idx+1);
  });
  main.innerHTML=html;
  updateStats();
}

function cardHTML(p, num){
  const dLabel={E:'Easy',M:'Medium',H:'Hard'}[p.diff];
  const solvedClass=solved[p.id]?'done':'';
  return `
<div class="pcard" id="card-${p.id}">
  <div class="pchead" onclick="toggleCard(${p.id})">
    <div class="pcnum">#${num}</div>
    <div class="pctitle">
      <div class="pcname">${p.name}</div>
      <div class="pcmeta">
        <span class="badge b${p.diff}">${dLabel}</span>
        <span class="btag">${p.tag}</span>
        <span class="btag">W${p.w} · ${p.topic}</span>
      </div>
    </div>
    <div class="pcactions">
      <div class="ckbtn ${solvedClass}" onclick="toggleSolved(event,${p.id})">${solved[p.id]?'✓':''}</div>
      <div class="chev">▾</div>
    </div>
  </div>
  <div class="solbody">
    ${solutionHTML(p)}
  </div>
</div>`;
}

function solutionHTML(p){
  const cxChips=p.ds.cx.map(c=>`<span class="cxchip">${c}</span>`).join('');
  return `
    <div class="oneliner">${p.oneliner}</div>

    <div class="ssec">
      <div class="stitle">Data Structure Choice</div>
      <div class="dscard">
        <div class="dsicon">${p.ds.icon}</div>
        <div class="dsbody">
          <div class="dsname">${p.ds.name}</div>
          <div class="dswhy">${p.ds.why}</div>
          <div class="dsalt">Why not alternatives: ${p.ds.alt}</div>
          <div class="dscx">${cxChips}</div>
        </div>
      </div>
    </div>

    <div class="ssec">
      <div class="stitle">Mental Model & Intuition</div>
      <div class="ibox">${p.intuition}</div>
    </div>

    <div class="ssec">
      <div class="stitle">Step-by-Step Approach</div>
      <div class="steps">${p.steps.map((s,i)=>`<div class="step"><div class="stepn">${i+1}</div><div>${s}</div></div>`).join('')}</div>
    </div>

    <div class="ssec">
      <div class="stitle">Java Solution</div>
      <div class="code">${escapeHtml(p.code)}</div>
    </div>

    <div class="ssec">
      <div class="im-row">
        <div class="icard"><strong>Key Insight</strong>${p.insight}</div>
        <div class="mcard"><strong>Common Mistake</strong>${p.mistake}</div>
      </div>
    </div>

    <div class="ssec">
      <div class="stitle">Pattern Signal</div>
      <div class="sigbox">${p.signal}</div>
    </div>
  `;
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCard(id){
  const card=document.getElementById('card-'+id);
  if(card) card.classList.toggle('open');
}

function toggleSolved(e,id){
  e.stopPropagation();
  const newVal=!solved[id];
  saveSolved(id,newVal);
  // update check button
  const btn=document.querySelector(`#card-${id} .ckbtn`);
  if(btn){ btn.classList.toggle('done',newVal); btn.textContent=newVal?'✓':''; }
  // update nav
  const navCheck=document.querySelector(`#nav-${id} .ncheck`);
  const navName=document.querySelector(`#nav-${id} .nname`);
  if(navCheck){ navCheck.classList.toggle('done',newVal); navCheck.textContent=newVal?'✓':''; }
  if(navName){ navName.classList.toggle('solved',newVal); }
  updateStats();
  buildSidebar();
}

function updateStats(){
  const filt=filtered();
  const done=filt.filter(p=>solved[p.id]).length;
  document.getElementById('done-count').textContent=done;
  document.getElementById('total-count').textContent=filt.length;
  const pct=filt.length?Math.round(done/filt.length*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('mainbar').style.width=pct+'%';
}

// ─────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────
loadSolved();
render();
</script>
